<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Le tue foto</title>
<style>
  :root{
    --fondo:#100E0C;
    --fondo2:#1A1714;
    --testo:#EDE7DB;
    --tenue:#9B9184;
    --oro:#D4AF5F;
    --bordo:#2C2723;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--fondo);color:var(--testo);
    font-family:"Avenir Next","Segoe UI",Roboto,-apple-system,system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    overscroll-behavior-y:contain}
  img{-webkit-user-drag:none;user-drag:none;pointer-events:none;display:block}

  header{position:sticky;top:0;z-index:20;background:rgba(16,14,12,.94);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--bordo);
    padding:14px 18px calc(12px);display:flex;align-items:baseline;gap:12px}
  header h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.02em}
  header .sub{font-size:12.5px;color:var(--tenue);margin-left:auto;text-align:right;line-height:1.35}

  .avviso{margin:16px 18px 0;padding:12px 14px;border:1px solid var(--bordo);
    border-radius:10px;background:var(--fondo2);font-size:13.5px;line-height:1.5;color:var(--tenue)}
  .avviso b{color:var(--testo);font-weight:600}

  #griglia{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:14px 6px 110px}
  @media(min-width:620px){#griglia{grid-template-columns:repeat(3,1fr);gap:8px;padding:16px 10px 110px}}
  @media(min-width:960px){#griglia{grid-template-columns:repeat(4,1fr)}}

  .cella{position:relative;background:var(--fondo2);border-radius:8px;overflow:hidden;
    aspect-ratio:3/2;cursor:pointer}
  .cella img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
  .cella img.on{opacity:1}
  .cella.scelta{outline:2px solid var(--oro);outline-offset:-2px}
  .cuore{position:absolute;right:6px;bottom:6px;width:38px;height:38px;border-radius:50%;
    display:grid;place-items:center;background:rgba(12,10,9,.62);border:none;
    font-size:19px;line-height:1;color:#fff;padding:0;cursor:pointer}
  .cella.scelta .cuore{background:var(--oro);color:#100E0C}
  .cod{position:absolute;left:7px;top:7px;font-size:11px;letter-spacing:.05em;
    color:rgba(255,255,255,.82);text-shadow:0 1px 3px rgba(0,0,0,.8)}

  #barra{position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:rgba(16,14,12,.96);backdrop-filter:blur(10px);
    border-top:1px solid var(--bordo);padding:12px 18px calc(12px + env(safe-area-inset-bottom));
    display:flex;align-items:center;gap:14px}
  #conta{font-size:14px}
  #conta b{color:var(--oro);font-weight:600}
  #fine{margin-left:auto;background:var(--oro);color:#100E0C;border:none;border-radius:8px;
    padding:11px 20px;font-size:14.5px;font-weight:600;font-family:inherit;cursor:pointer}
  #fine:disabled{opacity:.35;cursor:default}

  #lente{position:fixed;inset:0;z-index:50;background:#000;display:none;
    grid-template-rows:1fr auto;touch-action:pan-x}
  #lente.on{display:grid}
  #lenteImg{width:100%;height:100%;object-fit:contain}
  #lenteBarra{display:flex;align-items:center;gap:16px;padding:14px 18px calc(14px + env(safe-area-inset-bottom));
    background:var(--fondo)}
  #lenteCod{font-size:13px;color:var(--tenue);letter-spacing:.05em}
  .tondo{width:44px;height:44px;border-radius:50%;border:1px solid var(--bordo);
    background:var(--fondo2);color:var(--testo);font-size:19px;display:grid;place-items:center;
    padding:0;cursor:pointer;font-family:inherit}
  #lenteCuore.on{background:var(--oro);border-color:var(--oro);color:#100E0C}
  #lenteChiudi{margin-left:auto}

  #stato{padding:60px 28px;text-align:center;color:var(--tenue);font-size:15px;line-height:1.6}
  #stato h2{color:var(--testo);font-size:19px;font-weight:600;margin:0 0 10px}
  #toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,14px);z-index:60;
    background:rgba(30,26,22,.96);border:1px solid var(--bordo);color:var(--testo);
    padding:9px 16px;border-radius:20px;font-size:13.5px;opacity:0;pointer-events:none;
    transition:opacity .2s,transform .2s}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header hidden id="testa">
  <h1 id="titolo">Le tue foto</h1>
  <div class="sub" id="sottotitolo"></div>
</header>

<div id="stato">Apro la galleria…</div>

<div class="avviso" id="avviso" hidden>
  Tocca il <b>cuore</b> sulle foto che vuoi. Le riceverai senza scritte e in alta qualità
  dopo il pagamento. Il link resta attivo <b id="giorniAvviso">7 giorni</b>.
</div>

<div id="griglia"></div>

<div id="barra" hidden>
  <div id="conta">Nessuna foto scelta</div>
  <button id="fine" disabled>Ho finito</button>
</div>

<div id="lente">
  <img id="lenteImg" alt="">
  <div id="lenteBarra">
    <button class="tondo" id="lentePrec" aria-label="Foto precedente">‹</button>
    <button class="tondo" id="lenteSucc" aria-label="Foto successiva">›</button>
    <span id="lenteCod"></span>
    <button class="tondo" id="lenteCuore" aria-label="Scegli questa foto">♡</button>
    <button class="tondo" id="lenteChiudi" aria-label="Chiudi">✕</button>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SB_URL = "https://uqaddhbayyhudbmqixic.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVxYWRkaGJheXlodWRibXFpeGljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxODE5NDAsImV4cCI6MjEwMDc1Nzk0MH0.KNW8Wo6b3l87cZWEUncaFVgnHYS_RVWx0GwX8B1rY50";
const BUCKET = "vetrine";

const $ = id => document.getElementById(id);
let sb = null;
try{ sb = window.supabase ? window.supabase.createClient(SB_URL, SB_KEY) : null; }catch(_){ sb = null; }

const S = { vetrina:null, foto:[], idx:0 };

/* Deterrenti: non impediscono uno screenshot (nessuna pagina web puo'), servono solo
   a evitare il salvataggio banale dell'immagine. La protezione vera e' che il file
   sul bucket "vetrine" e' gia' ridotto e col watermark impresso dentro. */
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("dragstart", e => e.preventDefault());

function toast(m, ms){
  const t = $("toast"); t.textContent = m; t.classList.add("on");
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("on"), ms||1900);
}
function schermata(titolo, testo){
  $("stato").hidden = false;
  $("stato").innerHTML = "<h2></h2><p></p>";
  $("stato").querySelector("h2").textContent = titolo;
  $("stato").querySelector("p").textContent = testo;
  $("testa").hidden = true; $("avviso").hidden = true; $("barra").hidden = true;
}
function urlFile(path){
  return SB_URL + "/storage/v1/object/public/" + BUCKET + "/" + path;
}
function dataIt(iso){
  const d = new Date(iso);
  return d.toLocaleDateString("it-IT", {day:"numeric", month:"long"});
}

async function avvia(){
  const codice = new URLSearchParams(location.search).get("v");
  if(!codice){ schermata("Link incompleto", "Manca il codice della galleria. Chiedi al fotografo di rimandarti il link."); return; }
  if(!sb){ schermata("Connessione non riuscita", "Controlla la linea e ricarica la pagina."); return; }

  let vet;
  try{
    const {data, error} = await sb.from("vetrine").select("*").eq("codice", codice).maybeSingle();
    if(error) throw error;
    vet = data;
  }catch(e){
    schermata("Non riesco ad aprire la galleria", "Riprova fra poco o ricarica la pagina."); return;
  }
  if(!vet){ schermata("Galleria non trovata", "Il link potrebbe essere stato copiato male. Chiedi al fotografo di rimandartelo."); return; }

  const scaduta = new Date(vet.scade_il).getTime() < Date.now();
  if(scaduta){
    schermata("Il link è scaduto", "Le foto restano disponibili: scrivi al fotografo e te ne manda uno nuovo.");
    return;
  }
  S.vetrina = vet;

  /* L'apertura si registra sul database, non come notifica al volo: cosi' la postazione
     la ritrova anche se in questo momento e' spenta. */
  sb.from("vetrine").update({
    aperta_il: vet.aperta_il || new Date().toISOString(),
    aperture: (vet.aperture || 0) + 1
  }).eq("id", vet.id).then(()=>{}, ()=>{});

  const {data:righe, error:err2} = await sb.from("vetrina_foto")
    .select("*").eq("vetrina_id", vet.id).order("codice_foto");
  if(err2 || !righe || !righe.length){
    schermata("Galleria vuota", "Non ci sono ancora foto in questa galleria. Avvisa il fotografo."); return;
  }
  S.foto = righe.map(r => ({
    id: r.foto_id, cod: r.codice_foto, file: r.file, scelta: !!r.scelta
  }));

  $("stato").hidden = true;
  $("testa").hidden = false; $("avviso").hidden = false; $("barra").hidden = false;
  $("titolo").textContent = vet.titolo || "Le tue foto";
  $("sottotitolo").textContent = S.foto.length + " foto\nvalido fino al " + dataIt(vet.scade_il);
  $("sottotitolo").style.whiteSpace = "pre-line";
  const giorni = Math.max(1, Math.round((new Date(vet.scade_il) - Date.now())/86400000));
  $("giorniAvviso").textContent = giorni === 1 ? "ancora un giorno" : ("ancora " + giorni + " giorni");

  disegna();
  aggiornaConta();
}

function disegna(){
  const g = $("griglia");
  g.innerHTML = "";
  S.foto.forEach((f, i) => {
    const c = document.createElement("div");
    c.className = "cella" + (f.scelta ? " scelta" : "");
    c.dataset.i = i;
    const im = document.createElement("img");
    im.loading = "lazy"; im.alt = "";
    im.onload = () => im.classList.add("on");
    im.src = urlFile(f.file);
    const cod = document.createElement("span");
    cod.className = "cod"; cod.textContent = f.cod;
    const b = document.createElement("button");
    b.className = "cuore"; b.type = "button";
    b.textContent = f.scelta ? "♥" : "♡";
    b.setAttribute("aria-label", "Scegli la foto " + f.cod);
    b.onclick = ev => { ev.stopPropagation(); commuta(i); };
    c.appendChild(im); c.appendChild(cod); c.appendChild(b);
    c.onclick = () => apriLente(i);
    g.appendChild(c);
  });
}

async function commuta(i){
  const f = S.foto[i];
  f.scelta = !f.scelta;
  aggiornaCella(i);
  aggiornaConta();
  if(S.idx === i && $("lente").classList.contains("on")) aggiornaLente();
  try{
    const {error} = await sb.from("vetrina_foto").update({
      scelta: f.scelta,
      scelta_il: f.scelta ? new Date().toISOString() : null
    }).eq("vetrina_id", S.vetrina.id).eq("foto_id", f.id);
    if(error) throw error;
  }catch(e){
    f.scelta = !f.scelta;           // rimetto com'era: la scelta non e' stata salvata
    aggiornaCella(i); aggiornaConta();
    if($("lente").classList.contains("on")) aggiornaLente();
    toast("Scelta non salvata, controlla la linea", 2600);
  }
}

function aggiornaCella(i){
  const c = $("griglia").children[i];
  if(!c) return;
  c.classList.toggle("scelta", S.foto[i].scelta);
  c.querySelector(".cuore").textContent = S.foto[i].scelta ? "♥" : "♡";
}

function aggiornaConta(){
  const n = S.foto.filter(f => f.scelta).length;
  $("conta").innerHTML = n === 0
    ? "Nessuna foto scelta"
    : ("<b>" + n + "</b> " + (n === 1 ? "foto scelta" : "foto scelte"));
  $("fine").disabled = n === 0;
}

/* ---------- foto grande ---------- */
function apriLente(i){
  S.idx = i;
  $("lente").classList.add("on");
  aggiornaLente();
}
function aggiornaLente(){
  const f = S.foto[S.idx];
  $("lenteImg").src = urlFile(f.file);
  $("lenteCod").textContent = f.cod;
  const cu = $("lenteCuore");
  cu.textContent = f.scelta ? "♥" : "♡";
  cu.classList.toggle("on", f.scelta);
  $("lentePrec").disabled = S.idx === 0;
  $("lenteSucc").disabled = S.idx === S.foto.length - 1;
}
function scorri(d){
  const n = S.idx + d;
  if(n < 0 || n >= S.foto.length) return;
  S.idx = n; aggiornaLente();
}
$("lentePrec").onclick = () => scorri(-1);
$("lenteSucc").onclick = () => scorri(1);
$("lenteCuore").onclick = () => commuta(S.idx);
$("lenteChiudi").onclick = () => { $("lente").classList.remove("on"); };

let tocco = null;
$("lente").addEventListener("touchstart", e => { tocco = e.touches[0].clientX; }, {passive:true});
$("lente").addEventListener("touchend", e => {
  if(tocco === null) return;
  const dx = e.changedTouches[0].clientX - tocco;
  if(Math.abs(dx) > 55) scorri(dx < 0 ? 1 : -1);
  tocco = null;
}, {passive:true});
document.addEventListener("keydown", e => {
  if(!$("lente").classList.contains("on")) return;
  if(e.key === "ArrowLeft") scorri(-1);
  if(e.key === "ArrowRight") scorri(1);
  if(e.key === "Escape") $("lente").classList.remove("on");
});

$("fine").onclick = async () => {
  const n = S.foto.filter(f => f.scelta).length;
  try{
    await sb.from("vetrine").update({ chiusa_il: new Date().toISOString() }).eq("id", S.vetrina.id);
  }catch(_){}
  schermata("Grazie, ci pensiamo noi",
    "Hai scelto " + n + (n === 1 ? " foto" : " foto") +
    ". Ti arriva il link per il pagamento, e subito dopo le foto originali senza scritte.");
};

avvia();
</script>
</body>
</html>
