<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fay Live</title>
<style>
  :root{
    --bg:#0b0e14; --surface:#141922; --surface2:#1c2330; --line:#2a3444;
    --ink:#eef2f8; --muted:#8b97a8; --accent:#e0a008;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{min-height:100dvh;background:radial-gradient(1200px 600px at 50% -10%, #16202e, var(--bg));
    color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;padding:24px}
  .brand{text-align:center}
  .brand h1{font-size:clamp(38px,9vw,64px);margin:0;font-weight:800;letter-spacing:-1px}
  .brand h1 span{color:var(--accent)}
  .brand p{color:var(--muted);margin:8px 0 0;font-size:16px}
  .choices{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;width:100%;max-width:640px}
  .card{flex:1 1 240px;max-width:290px;background:var(--surface);border:1px solid var(--line);
    border-radius:20px;padding:30px 26px;text-decoration:none;color:var(--ink);
    display:flex;flex-direction:column;align-items:center;gap:14px;transition:.15s;cursor:pointer}
  .card:hover{border-color:var(--accent);transform:translateY(-3px);background:var(--surface2)}
  .card .ic{width:76px;height:76px;display:flex;align-items:center;justify-content:center}
  .card .ic svg{width:76px;height:76px;stroke:var(--accent);fill:none;stroke-width:1.6}
  .card h2{margin:0;font-size:23px;font-weight:700}
  .card p{margin:0;color:var(--muted);font-size:14.5px;text-align:center;line-height:1.5}
  footer{color:var(--muted);font-size:13px;opacity:.6;text-align:center}
</style>
</head>
<body>
  <div class="brand">
    <h1>Fay <span>Live</span></h1>
    <p>Scegli come vuoi entrare</p>
  </div>

  <div class="choices">
    <a class="card" href="pc.html">
      <div class="ic"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg></div>
      <h2>PC / Postazione</h2>
      <p>Importa le foto dalla SD, gestisci i rulli, stampa ed esporta. Tutte le funzioni.</p>
    </a>

    <a class="card" href="tablet.html">
      <div class="ic"><svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2.5"/><path d="M11 18h2"/></svg></div>
      <h2>Tablet</h2>
      <p>Mostra le foto al cliente: sfoglia, ingrandisci con le dita e scegli i preferiti.</p>
    </a>
  </div>

  <footer>Frame About You · Fay Live</footer>
</body>
</html>
