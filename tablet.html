/* ---------- invii non riusciti, salvati SUL TABLET ----------
   Se manca la linea, l'invio non parte E il registro sul cloud non si puo' scrivere:
   l'indirizzo del cliente si perdeva del tutto. Ora ogni invio viene messo da parte QUI
   prima ancora di partire, e viene tolto solo quando il server conferma. Quello che resta
   e' la lista dei clienti a cui le foto non sono arrivate, con il tasto per rispedire. */
const KO_KEY = "faylive_invii_ko";
function leggiKO(){
  try{ return JSON.parse(localStorage.getItem(KO_KEY) || "[]"); }catch(_){ return []; }
}
function scriviKO(v){
  try{ localStorage.setItem(KO_KEY, JSON.stringify(v.slice(-100))); }catch(_){}
  aggiornaSpiaInvii();
}
function salvaKO(rec){
  const v = leggiKO().filter(x=>x.id!==rec.id);
  v.push(rec); scriviKO(v);
}
function rimuoviKO(id){ scriviKO(leggiKO().filter(x=>x.id!==id)); }
function aggiornaSpiaInvii(){
  const n = leggiKO().length;
  const b = $("btnInvii"); if(!b) return;
  const et = b.querySelectorAll("span")[1];
  if(et) et.textContent = n ? `Registro (${n})` : "Registro";
  b.style.color = n ? "#ff8080" : "";
}
/* Un invio segnato "in corso" resta qui anche quando in realtà era partito: la riga si
   scrive PRIMA di spedire e si toglie solo alla conferma del server, che sull'hotspot a
   volte non torna. Prima di rispedire si controlla il registro sul cloud, altrimenti il
   cliente riceve due link. */
async function giaInviato(rec){
  if(!sb || !rec.servizioId || !rec.email) return null;
  try{
    const {data} = await sb.from("attivita").select("creato_il,dettaglio")
      .eq("servizio_id", rec.servizioId).eq("azione","~invio").eq("esito","ok")
      .ilike("dettaglio", "%"+rec.email+"%").order("creato_il",{ascending:false}).limit(1);
    if(data && data.length){
      const t = new Date(data[0].creato_il);
      return isNaN(t.getTime()) ? "risulta già inviato"
           : "già inviato alle " + t.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
    }
  }catch(_){}
  return null;
}
/* Rispedisce un invio rimasto indietro: ritrova le foto dai codici e rilancia. */
async function riprovaKO(id, btn){
  const rec = leggiKO().find(x=>x.id===id);
  if(!rec){ mostraEsito("Questo invio non è più nella lista.","Non posso rispedire"); return; }
  if(!S.servizio || String(rec.servizioId)!==String(S.servizio.id)){
    mostraEsito("Questo invio è del "+(rec.giorno||"un'altra giornata")+
                ".\nApri quella giornata e rispediscilo da lì.","Non posso rispedire"); return;
  }
  const ps = (rec.codici||[]).map(c=>S.photos.find(p=>p.code===c)).filter(Boolean);
  if(!ps.length){
    mostraEsito("Le foto di questo invio non sono nella giornata aperta:\n"+
                (rec.codici||[]).join(", "),"Non posso rispedire"); return;
  }
  const testo = btn ? btn.textContent : "";
  if(btn){ btn.disabled=true; btn.textContent="Controllo…"; }
  try{
    const gia = await giaInviato(rec);
    if(gia){
      const ancora = confirm(`Attenzione: a ${rec.email} risulta ${gia}.\n\n` +
        `Probabilmente le foto sono partite e si è persa solo la conferma.\n\n` +
        `OK = rispedisco lo stesso (il cliente riceve un secondo link)\n` +
        `Annulla = tolgo l'invio dalla lista`);
      if(!ancora){ rimuoviKO(rec.id); renderKO(); toast("Invio tolto dalla lista"); return; }
    }
    if(btn) btn.textContent="Rispedisco…";
    await inviaConFilemail(ps, "", {emailGia: rec.email, koId: rec.id});
  }catch(err){
    console.warn("riprovaKO", err);
    mostraEsito("Non sono riuscito a rispedire.\n\n"+((err&&err.message)||err),"Invio non riuscito");
  }finally{
    if(btn){ btn.disabled=false; btn.textContent=testo||"Riprova"; }
    renderKO();
  }
}
function renderKO(){
  const box = $("invKO"); if(!box) return;
  const v = leggiKO().slice().reverse();
  if(!v.length){ box.innerHTML=""; return; }
  box.innerHTML = `<div style="padding:12px 14px;background:#3a1c1c;border-radius:12px;margin:10px 0">
    <div style="font-weight:700;margin-bottom:8px">✉ Non partiti da questo tablet (${v.length})</div>` +
    v.map(r=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #55302f">
        <div style="flex:1;min-width:0">
          <div style="font-weight:600;word-break:break-all">${esc(r.email)}</div>
          <div style="opacity:.8;font-size:13px">${esc((r.codici||[]).join(", ")).slice(0,120)}</div>
          <div style="opacity:.6;font-size:12px">${esc(r.giorno||"")} · ${esc(r.motivo||"non riuscito")}${
            /in corso/.test(r.motivo||"") ? " — potrebbe essere partito lo stesso: tocca Riprova per controllare" : ""}</div>
        </div>
        <button data-ko="${esc(r.id)}" style="padding:8px 12px;border-radius:9px">Riprova</button>
        <button data-kox="${esc(r.id)}" title="Toglilo dalla lista" style="padding:8px 10px;border-radius:9px">✕</button>
      </div>`).join("") + `</div>`;
  box.querySelectorAll("[data-ko]").forEach(b=> b.onclick = ()=> riprovaKO(b.dataset.ko, b));
  box.querySelectorAll("[data-kox]").forEach(b=> b.onclick = ()=>{
    if(confirm("Tolgo questo invio dalla lista? L'indirizzo del cliente non resta da nessuna parte."))
      { rimuoviKO(b.dataset.kox); renderKO(); }
  });
}

async function inviaConFilemail(list, ctx, opz){
  if(!list.length){ toast("Nessuna foto da inviare"+(ctx||"")); return; }
  if(!sb || !S.servizio){ mostraEsito("Cloud non raggiungibile: controlla la connessione.","Invio non riuscito"); return; }
  const email = (opz && opz.emailGia) || await chiediEmail(list.length);
  if(!email) return;

  mostraAttesa("Controllo che le foto siano pronte…");
  await ensureOriginals(list);

  /* Controllo finale: tra la fine dell'attesa e l'invio possono essere arrivati altri
     originali. Meglio una query in piu' che spedire al cliente meta' delle sue foto. */
  try{
    const senza = list.filter(p=>!haOriginale(p));
    if(senza.length && sb){
      const {data} = await sb.from("foto").select("id,originale_url").in("id", senza.map(p=>p.id));
      (data||[]).forEach(row=>{
        if(!row.originale_url) return;
        const v = S.byId.get(row.id); if(v) v.origPath = row.originale_url;
        const q = list.find(x=>x.id===row.id); if(q) q.origPath = row.originale_url;
      });
    }
  }catch(_){}

  /* Gli indirizzi firmati si chiedono TUTTI IN UNA VOLTA: prima era una richiesta per
     foto, in fila — con 45 foto erano 45 viaggi sull'hotspot prima ancora di iniziare,
     ed e' quella l'attesa muta che si vedeva dopo aver confermato l'email. */
  mostraAttesa("Preparo le foto da inviare…");
  const files=[], mancanti=[];
  const pronte = list.map(p=>vivo(p)).filter(p=>{ if(p.origPath) return true; mancanti.push(p.code); return false; });
  const perPercorso = new Map();
  pronte.forEach(p=>{ if(!perPercorso.has(p.origPath)) perPercorso.set(p.origPath, p); });
  try{
    const percorsi = [...perPercorso.keys()];
    const {data,error} = await sb.storage.from("originali").createSignedUrls(percorsi, 3600);
    if(error) throw error;
    (data||[]).forEach(r=>{
      const p = perPercorso.get(r.path);
      if(!p) return;
      if(r.error || !r.signedUrl){ mancanti.push(p.code); return; }
      files.push({nome:p.code+".jpg", url:r.signedUrl});
    });
  }catch(_){
    /* Ripiego sulla vecchia strada, una per volta: piu' lenta ma sempre meglio che
       lasciare il cliente senza foto se la richiesta in blocco non passa. */
    for(const p of pronte){
      if(files.some(f=>f.nome===p.code+".jpg")) continue;
      try{
        const {data,error}=await sb.storage.from("originali").createSignedUrl(p.origPath, 3600);
        if(error||!data||!data.signedUrl){ mancanti.push(p.code); continue; }
        files.push({nome:p.code+".jpg", url:data.signedUrl});
      }catch(_){ mancanti.push(p.code); }
    }
  }
  if(!files.length){
    mostraEsito("Gli originali di queste foto non sono ancora sul cloud.\nAspetta che PC1 finisca di caricarli e riprova.","Invio non riuscito");
    return;
  }
  /* Un invio parziale non si fa di nascosto: il cliente riceverebbe meno foto di quelle
     scelte senza che nessuno se ne accorga. Si decide sul momento. */
  if(mancanti.length){
    const ok = confirm(`${mancanti.length} foto su ${list.length} non sono ancora pronte:\n${mancanti.join(", ")}\n\n` +
                       `OK = invio subito le ${files.length} pronte\nAnnulla = aspetto e riprovo fra poco`);
    if(!ok){ toast("Invio rimandato: riprova fra qualche secondo"); return; }
  }

  const b=$("btnSend"); b.disabled=true;
  attesaInCorso = true; await tieniSchermoAcceso();
  /* Messo da parte PRIMA di partire: se cade la linea, si spegne il tablet o si chiude la
     pagina a meta' invio, l'indirizzo del cliente resta comunque qui. */
  const koId = (opz && opz.koId) || ("ko"+Date.now()+Math.random().toString(36).slice(2,6));
  salvaKO({ id:koId, ts:Date.now(), email,
            servizioId: S.servizio ? S.servizio.id : null,
            giorno: (S.servizio && S.servizio.data_servizio) || "",
            codici: list.map(p=>p.code), motivo:"invio in corso" });
  /* L'invio è spezzato in tre: si apre il trasferimento, si caricano le foto a gruppetti
     di 6 (una chiamata breve ciascuno) e si chiude. Prima era una chiamata sola che
     faceva tutto: oltre le ~20 foto sforava i 60 secondi di Vercel e tornava un 504
     senza che partisse niente. Per la fotografa non cambia nulla: un tocco solo,
     con il contatore che sale. */
  const A_GRUPPETTO = 6;
  mostraAvanzamento(0, files.length);
  try{
    const apertura = await chiamataInvio("/api/invia-apri", {
      email,
      oggetto:"Le tue foto — Frame About You",
      messaggio:"Grazie per la serata! Ecco le tue foto."
    }, 30000);

    const caricate=[], saltate=[];
    for(let i=0; i<files.length; i+=A_GRUPPETTO){
      const gruppetto = files.slice(i, i+A_GRUPPETTO);
      const esito = await chiamataInvio("/api/invia-pezzo", {
        transferid: apertura.transferid,
        transferkey: apertura.transferkey,
        transferurl: apertura.transferurl,
        files: gruppetto
      }, 70000);
      caricate.push(...(esito.caricate||[]));
      (esito.saltate||[]).forEach(s=>saltate.push(s.nome));
      mostraAvanzamento(caricate.length, files.length);
    }

    if(!caricate.length)
      throw new Error("Nessuna foto è arrivata a destinazione.\nControlla che gli originali siano sul cloud e riprova.");

    await chiamataInvio("/api/invia-chiudi", {
      transferid: apertura.transferid,
      transferkey: apertura.transferkey,
      logintoken: apertura.logintoken
    }, 30000);

    rimuoviKO(koId);                 // il server ha confermato: non e' piu' in sospeso
    logActivity(list,"inviate");
    logTecnico(list, "invio", {dettaglio:`${caricate.length}/${list.length} foto a ${email}`+(mancanti.length?" — saltate: "+mancanti.join(", "):"")});
    mostraEsito(`Inviate ${caricate.length} foto a ${email}.`+
                (saltate.length?`\n${saltate.length} non sono passate: ${saltate.join(", ")}`:"")+
                `\nIl cliente riceve un link valido 7 giorni.`);
  }catch(err){
    console.warn("filemail", err);
    const spiega = (err && err.message) ? err.message : String(err);
    salvaKO({ id:koId, ts:Date.now(), email,
              servizioId: S.servizio ? S.servizio.id : null,
              giorno: (S.servizio && S.servizio.data_servizio) || "",
              codici: list.map(p=>p.code), motivo: spiega.split("\n")[0] });
    logTecnico(list, "invio", {esito:"errore", dettaglio:`${email} — `+spiega.slice(0,200)});
    mostraEsito(spiega+"\n\nL'invio resta nel Registro: da lì puoi rispedirlo.", "Invio non riuscito");
  }finally{ b.disabled=false; attesaInCorso=false; rilasciaSchermo(); }
}

/* ---------- visore con zoom (pinch) e swipe ---------- */
const V = { list:[], idx:0, img:null, scale:1, tx:0, ty:0, canvas:null, ctx:null };
async function openViewer(p){
  V.list = visible(); V.idx = V.list.findIndex(x=>x.id===p.id);
  $("viewer").classList.add("open");
  V.canvas=$("vCanvas"); V.ctx=V.canvas.getContext("2d");
  slideX=0; animando=false;
  sizeCanvas();
  await showCurrent();
}
function sizeCanvas(){
  const c=V.canvas, r=c.getBoundingClientRect();
  c.width=r.width*devicePixelRatio; c.height=r.height*devicePixelRatio;
}
/* Anteprime grandi tenute in memoria: quelle gia' viste e quelle che stanno per servire. */
const bigCache = new Map();          // url -> Image decodificata
function ricordaBig(url, im){
  bigCache.set(url, im);
  if(bigCache.size>14){
    const k = bigCache.keys().next().value;
    const vecchia = bigCache.get(k);
    bigCache.delete(k);
    try{ if(vecchia && vecchia._obj) URL.revokeObjectURL(vecchia._obj); }catch(_){}
  }
}
/* L'anteprima grande passa anch'essa dal magazzino: la seconda volta che il cliente
   torna sulla stessa foto compare subito, senza rete. */
async function caricaBig(url){
  if(!url) return null;
  const gia = bigCache.get(url);
  if(gia) return gia;
  try{
    const blob = await scaricaImmagine(url, 20000);
    const obj = URL.createObjectURL(blob);
    const im = new Image();
    im.src = obj;
    await im.decode();
    im._obj = obj;
    ricordaBig(url, im);
    return im;
  }catch(_){ return null; }
}
/* Precarica in silenzio le due foto avanti e una indietro: scorrendo col dito la
   successiva e' gia' pronta invece di comparire nera per qualche secondo. */
function precaricaVicine(){
  [1,2,-1].forEach(d=>{
    const q = V.list[V.idx+d];
    if(q) caricaBig(q.bigUrl || q.url);
  });
}

async function showCurrent(){
  const p=V.list[V.idx]; if(!p) return;
  $("vCode").textContent=p.code;
  $("vFav").classList.toggle("on",p.fav); $("vFav").textContent=p.fav?'♥':'♡';
  V.scale=1; V.tx=0; V.ty=0;
  const url = p.bigUrl || p.url;

  /* 1) se l'anteprima grande e' gia' in memoria si mostra all'istante */
  const pronta = bigCache.get(url);
  if(pronta){ V.img=pronta; draw(); precaricaVicine(); return; }

  /* 2) altrimenti si mostra SUBITO la miniatura gia' decodificata, ingrandita.
     Per un attimo e' meno nitida, ma il cliente vede la sua foto invece del nero:
     un vuoto nero davanti al cliente sembra un guasto, una foto morbida no. */
  V.img = (p.url && thumbBmpCache.get(p.url)) || null;
  draw();

  /* 3) e appena arriva la versione grande si sostituisce, se siamo ancora su questa foto */
  const atteso = p.code;
  const im = await caricaBig(url);
  if(im && V.list[V.idx] && V.list[V.idx].code === atteso){ V.img=im; draw(); }
  precaricaVicine();
}
/* Fra una foto e l'altra passa solo una STRISCIA nera di pochi millimetri: le due foto
   scorrono affiancate, come le pagine di un album. Prima la foto usciva da sola e per un
   attimo restava tutto lo schermo nero, che sembrava una tendina. */
const STRISCIA = 18;          // larghezza della striscia nera, in px
let slideX = 0;               // spostamento in corso, in px
function disegnaFoto(img, off){
  if(!img) return;
  const c=V.canvas, ctx=V.ctx;
  const cw=c.width, ch=c.height;
  const iw=img.naturalWidth || img.width, ih=img.naturalHeight || img.height;
  const base=Math.min(cw/iw, ch/ih);
  const k=base*V.scale;
  const w=iw*k, h=ih*k;
  const x=(cw-w)/2 + (V.tx + off)*devicePixelRatio;
  const y=(ch-h)/2 + V.ty*devicePixelRatio;
  ctx.drawImage(img, x, y, w, h);
}
function immagineDi(p){
  if(!p) return null;
  const u = p.bigUrl || p.url;
  return bigCache.get(u) || (p.url && thumbBmpCache.get(p.url)) || null;
}
function draw(){
  const c=V.canvas, ctx=V.ctx; if(!ctx) return;
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,c.width,c.height);
  ctx.fillStyle="#000"; ctx.fillRect(0,0,c.width,c.height);
  disegnaFoto(V.img, slideX);
  if(slideX){                                   // la foto accanto entra dallo stesso passo
    const passo = (c.clientWidth || 300) + STRISCIA;
    const vicina = slideX < 0 ? V.list[V.idx+1] : V.list[V.idx-1];
    disegnaFoto(immagineDi(vicina), slideX + (slideX<0 ? passo : -passo));
  }
}
$("vClose").onclick=closeViewer;
function closeViewer(){ $("viewer").classList.remove("open"); V.img=null; }
$("vFav").onclick=()=>{ const p=V.list[V.idx]; if(p){ toggleFav(p); $("vFav").classList.toggle("on",p.fav); $("vFav").textContent=p.fav?'♥':'♡'; } };
addEventListener("resize",()=>{ if($("viewer").classList.contains("open")){ sizeCanvas(); draw(); } });

/* gesti touch: 1 dito = swipe (se non zoomato) o pan (se zoomato); 2 dita = pinch zoom */
let touchStart=null, pinchStart=null, panStart=null;
const viewer=$("viewer");
viewer.addEventListener("touchstart",e=>{
  if(e.touches.length===2){
    pinchStart={ d:dist(e.touches), scale:V.scale };
  } else if(e.touches.length===1){
    touchStart={ x:e.touches[0].clientX, y:e.touches[0].clientY, t:Date.now() };
    panStart={ tx:V.tx, ty:V.ty };
  }
},{passive:false});
viewer.addEventListener("touchmove",e=>{
  e.preventDefault();
  if(e.touches.length===2 && pinchStart){
    const d=dist(e.touches);
    V.scale=Math.max(1, Math.min(5, pinchStart.scale * d/pinchStart.d));
    draw();
  } else if(e.touches.length===1 && touchStart){
    const dx=e.touches[0].clientX-touchStart.x, dy=e.touches[0].clientY-touchStart.y;
    if(V.scale>1){ V.tx=panStart.tx+dx; V.ty=panStart.ty+dy; draw(); }
    else if(Math.abs(dx)>Math.abs(dy)) trascinaFoto(dx);   // segue il dito
  }
},{passive:false});
viewer.addEventListener("touchend",e=>{
  if(pinchStart && e.touches.length<2){ pinchStart=null; if(V.scale<1.05){ V.scale=1; V.tx=0; V.ty=0; draw(); } return; }
  if(touchStart && V.scale<=1.05){
    const dx=(e.changedTouches[0].clientX-touchStart.x);
    const dt=Date.now()-touchStart.t;
    if(Math.abs(dx)>60 && dt<600 &&
       ((dx<0 && V.idx<V.list.length-1) || (dx>0 && V.idx>0))){
      cambiaFotoAnimata(dx<0 ? 1 : -1);
    }else{
      tornaAlPosto();                     // scorrimento troppo corto: la foto rimbalza indietro
    }
  }
  touchStart=null;
},{passive:false});
function dist(t){ const a=t[0], b=t[1]; return Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY); }

/* ---------- scorrimento animato fra le foto ----------
   Tutto sul canvas con una trasformazione CSS: la foto segue il dito, esce di lato e la
   successiva entra dall'altro. Nessun disegno in più, quindi non pesa sui tablet. */
let animando = false;
function trascinaFoto(dx){
  if(animando || !V.canvas) return;
  const bordo = (dx>0 && V.idx===0) || (dx<0 && V.idx===V.list.length-1);
  slideX = bordo ? dx*0.25 : dx;      // primo/ultimo: resiste, si capisce che è finita
  draw();
}
function animaSlide(a, b, ms, poi){
  animando = true;
  const t0 = performance.now();
  (function passo(t){
    const k = Math.min(1, (t - t0)/ms);
    slideX = a + (b - a) * (1 - Math.pow(1 - k, 3));   // parte svelta e si posa
    draw();
    if(k < 1) requestAnimationFrame(passo);
    else { slideX = b; animando = false; if(poi) poi(); }
  })(t0);
}
function tornaAlPosto(){
  if(!slideX) return;
  animaSlide(slideX, 0, 160);
}
function cambiaFotoAnimata(verso){                 // +1 avanti, -1 indietro
  if(animando || !V.canvas) return;
  const passo = (V.canvas.clientWidth || 300) + STRISCIA;
  animaSlide(slideX, -verso*passo, 170, ()=>{
    V.idx += verso;
    slideX = 0;                                    // la nuova foto è già al centro
    showCurrent();
  });
}

/* ---------- aggiornamento (manuale e automatico) ---------- */
let opBusy = 0;      // >0 mentre sto condividendo/esportando: non aggiorno sotto i piedi

async function refresh(manuale){
  if(!sb || !S.sede || refreshing) return;
  refreshing = true;
  const btn = $("btnRefresh"); if(btn) btn.classList.add("busy");
  try{
    // se non c'è ancora una giornata aperta, riparto dalla sede
    if(!S.servizio){ await chooseSede(S.sede); return; }

    const g = $("grid");
    const scroll = g.scrollTop;
    const prevLetter = S.letter, prevGruppo = S.gruppo;
    const prima = S.photos.length;

    const {data:rulli, error:eR} = await sb.from("rulli").select("*").eq("servizio_id", S.servizio.id);
    if(eR) throw eR;
    const rmap = {}; (rulli||[]).forEach(r=> rmap[r.id]={lettera:r.lettera, desc:r.descrizione});
    const ids = Object.keys(rmap);

    const nuove = []; const map = new Map();
    if(ids.length){
      const foto = await caricaFotoDeiRulli(ids);
      (foto||[]).forEach(f=>{
        const r = rmap[f.rullo_id]; if(!r) return;
        const p = { id:f.id, code:f.codice, letter:r.lettera, url:f.mini_url||f.anteprima_url, bigUrl:f.anteprima_url||null, miniUrl:f.mini_url||null,
                    origPath:f.originale_url||null, fav:!!f.preferito, gruppo:f.gruppo||null };
        const vecchia = S.byId.get(f.id);
        if(vecchia && vecchia.wide) p.wide = true;   // verso già noto: niente ridisegno inutile
        if(vecchia && vecchia.origPath && !p.origPath) p.origPath = vecchia.origPath;
        nuove.push(p); map.set(p.id, p);
      });
    }

    ordinaFoto(nuove);
    applicaFavLocali(nuove);        // i preferiti scelti qui non si perdono con l'aggiornamento
    S.rulli = rmap; S.photos = nuove; S.byId = map;
    // tengo il rullo/gruppo che stavo guardando, se esiste ancora
    const lettereRulli = new Set(Object.values(rmap).map(r=>r.lettera));
    S.letter = (prevLetter && lettereRulli.has(prevLetter)) ? prevLetter : null;
    S.gruppo = (prevGruppo && nuove.some(p=>p.gruppo===prevGruppo)) ? prevGruppo : null;
    // tengo la selezione, scartando le foto sparite
    S.selected = new Set([...S.selected].filter(id=> map.has(id)));

    render();
    g.scrollTop = scroll;
    requestAnimationFrame(()=>{ g.scrollTop = scroll; });

    const diff = nuove.length - prima;
    const ora = new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
    setDot(true, "Aggiornato alle "+ora);
    if(diff > 0) toast(diff===1 ? "1 foto nuova" : `${diff} foto nuove`);
    else if(manuale) toast("Nessuna foto nuova");

    subscribe();   // riaggancia il tempo reale se il collegamento era caduto
  }catch(err){
    console.warn("refresh", err);
    setDot(false, "Aggiornamento non riuscito");
    if(manuale) toast("Aggiornamento non riuscito — controlla la linea");
  }finally{
    refreshing = false;
    const b = $("btnRefresh"); if(b) b.classList.remove("busy");
  }
}

/* =====================================================================
   INVII — registro delle email partite da questo tablet e dalle postazioni.
   Legge le righe "~invio" della tabella attivita, che vengono scritte a ogni
   tentativo Filemail: l'esito qui e' quello vero del servizio di invio, non una
   spunta messa a mano. Diviso per giornata e per rullo, con il reinvio a portata
   di dito: capita spesso che l'email sia stata dettata male nella musica.
   ===================================================================== */
const INV = { righe:[], giorni:{}, filtro:"tutti", corrente:null };

function invPulito(x){ return String(x==null?"":x).replace(/[<>&"]/g,""); }
/* Il dettaglio non ha un formato unico: il PC scrive "email — motivo", il tablet
   "3/4 foto a email — saltate: …". L'indirizzo si pesca comunque. */
function invEmailDi(riga){
  const m = String(riga.dettaglio||"").match(/[^\s,;<>()]+@[^\s,;<>()]+\.[^\s,;<>()]+/);
  return m ? m[0] : "";
}
function invMotivoDi(riga){
  if(riga.esito !== "errore") return "";
  const pezzi = String(riga.dettaglio||"").split(" — ");
  return pezzi.length > 1 ? pezzi.slice(1).join(" — ") : String(riga.dettaglio||"");
}
function invCodiciDi(riga){
  return String(riga.codici||"").split(/[,\s]+/).map(c=>c.trim()).filter(Boolean);
}
/* Il rullo non e' sempre salvato sulla riga, ma la lettera del codice E' il rullo:
   M-433 -> rullo M. Un invio che mescola piu' rulli finisce sotto "misti". */
function invRulloDi(riga){
  if(riga.rullo_lettera) return riga.rullo_lettera;
  const l = [...new Set(invCodiciDi(riga).map(c=>(c.split("-")[0]||"").toUpperCase()).filter(Boolean))];
  return !l.length ? "—" : (l.length===1 ? l[0] : "misti");
}

async function invCarica(){
  const box = $("invList");
  if(!sb || !S.sede){ box.innerHTML = '<p class="ivuoto"><b>Serve una sede</b>Scegli prima la sede in alto.</p>'; return; }
  box.innerHTML = '<p class="ivuoto">Carico…</p>';
  INV.righe = []; INV.giorni = {};
  const gg = parseInt($("invGiorni").value,10) || 30;
  const limite = new Date(Date.now() - gg*24*3600*1000).toISOString().slice(0,10);
  try{
    // solo le giornate di QUESTA sede: ogni locale vede i propri invii e basta
    const {data:servizi} = await sb.from("servizi").select("id,data_servizio")
      .eq("sede_id", S.sede.id).gte("data_servizio", limite);
    if(!servizi || !servizi.length){
      box.innerHTML = '<p class="ivuoto"><b>Nessuna giornata</b>In questo periodo la sede non ha servizi.</p>';
      invContatori([]); return;
    }
    servizi.forEach(v=>{ INV.giorni[v.id] = v.data_servizio; });
    const {data} = await sb.from("attivita").select("*")
      .in("servizio_id", servizi.map(v=>v.id))
      .eq("azione", "~invio")
      .order("creato_il", {ascending:false}).limit(1000);
    INV.righe = data || [];
  }catch(err){
    console.warn("registro invii", err);
    box.innerHTML = '<p class="ivuoto"><b>Registro non caricato</b>La connessione non ha risposto. Riapri per riprovare.</p>';
    return;
  }
  invRender();
}

function invContatori(righe){
  const ko = righe.filter(a=>a.esito==="errore").length;
  $("invNT").textContent = righe.length || "";
  $("invNO").textContent = righe.length ? (righe.length-ko) : "";
  $("invNK").textContent = ko || "";
}

function invRender(){
  const box = $("invList");
  const q = $("invCerca").value.trim().toLowerCase();
  invContatori(INV.righe);

  let righe = INV.righe;
  if(INV.filtro==="ko") righe = righe.filter(a=>a.esito==="errore");
  if(INV.filtro==="ok") righe = righe.filter(a=>a.esito!=="errore");
  if(q) righe = righe.filter(a=>
    String(a.dettaglio||"").toLowerCase().includes(q) ||
    String(a.codici||"").toLowerCase().includes(q));

  if(!righe.length){
    const m = q ? "<b>Nessun risultato</b>Nessun invio con quello che hai scritto."
      : INV.filtro==="ko" ? "<b>Nessun invio fallito</b>In questo periodo sono partiti tutti."
      : INV.filtro==="ok" ? "<b>Nessun invio riuscito</b>Nel periodo scelto non risulta nessun invio andato a buon fine."
      : "<b>Nessun invio</b>In questo periodo non e' partita nessuna email.";
    box.innerHTML = '<p class="ivuoto">'+m+'</p>';
    return;
  }

  const perGiorno = {};
  righe.forEach(a=>{
    const g = INV.giorni[a.servizio_id] || String(a.creato_il).slice(0,10);
    (perGiorno[g] = perGiorno[g]||[]).push(a);
  });

  box.innerHTML = Object.keys(perGiorno).sort().reverse().map(g=>{
    const lista = perGiorno[g];
    const ko = lista.filter(a=>a.esito==="errore").length;
    const d = new Date(g+"T12:00:00");
    const tit = isNaN(d) ? g : d.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});

    const perRullo = {};
    lista.forEach(a=>{ const r=invRulloDi(a); (perRullo[r]=perRullo[r]||[]).push(a); });

    const blocchi = Object.keys(perRullo).sort().map(r=>{
      const voci = perRullo[r].map(a=>{
        const t = new Date(a.creato_il).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
        const err = a.esito==="errore";
        const em = invEmailDi(a), mo = invMotivoDi(a);
        return '<button class="iriga'+(err?" ko":"")+'" data-id="'+a.id+'">'
          + '<span class="l1"><span class="ora">'+t+'</span>'
          + '<span class="es">'+(err?"Non riuscito":"Inviate")+'</span>'
          + '<span class="q">'+(a.quante||0)+' foto · '+invPulito(a.postazione||"?")+'</span></span>'
          + '<span class="em">'+(invPulito(em)||"email non registrata")+'</span>'
          + (mo?'<span class="mo">'+invPulito(mo)+'</span>':"")
          + '<span class="cd">'+(invPulito(a.codici)||"—")+'</span></button>';
      }).join("");
      const kor = perRullo[r].filter(a=>a.esito==="errore").length;
      return '<section class="irullo"><h4><span class="lt">'+invPulito(r)+'</span> '
        + perRullo[r].length+' invii'+(kor?' · <span style="color:#ff8080">'+kor+' da rifare</span>':"")
        + '</h4>'+voci+'</section>';
    }).join("");

    return '<section class="igiorno"><h3>'+tit+'<span class="m">'+lista.length+' invii'
      + (ko?' · <span class="ko">'+ko+' non riusciti</span>':"")+'</span></h3>'+blocchi+'</section>';
  }).join("");
}

/* ---------- dettaglio e reinvio ---------- */
function invApri(id){
  const a = INV.righe.find(x=>String(x.id)===String(id)); if(!a) return;
  INV.corrente = a;
  const g = INV.giorni[a.servizio_id] || String(a.creato_il).slice(0,10);
  const d = new Date(g+"T12:00:00");
  const quando = isNaN(d) ? g : d.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});
  const ora = new Date(a.creato_il).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
  const mo = invMotivoDi(a);
  $("invTit").textContent = a.esito==="errore" ? "Invio non riuscito" : "Invio andato a buon fine";
  $("invSub").textContent = quando+", ore "+ora+" · rullo "+invRulloDi(a)+" · "+(a.quante||0)+" foto"
    + (mo? " · "+mo : "");
  $("invEmail").value = invEmailDi(a);
  $("invCodici").textContent = invCodiciDi(a).join("  ") || "—";
  $("invMsg").className = "";
  $("invRifai").disabled = false; $("invRifai").textContent = "Invia di nuovo";
  $("invSheet").classList.add("on");
}
function invChiudiSheet(){ $("invSheet").classList.remove("on"); INV.corrente = null; }
function invEsito(testo, ok){
  const e = $("invMsg"); e.textContent = testo; e.className = "on " + (ok?"ok":"ko");
}

async function invRifaiInvio(){
  const a = INV.corrente; if(!a || !sb) return;
  const email = $("invEmail").value.trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ invEsito("L'indirizzo email non e' valido: controllalo e riprova.", false); return; }
  const codici = invCodiciDi(a);
  if(!codici.length){ invEsito("Questo invio non ha codici foto collegati: rifallo dal PC.", false); return; }

  const b = $("invRifai"); b.disabled = true; b.textContent = "Preparo le foto…";
  invEsito("Cerco gli originali sul cloud…", true);

  /* Gli originali non sono pubblici: servono link firmati a scadenza breve, che la
     funzione su Vercel usa per scaricarli. Le foto oltre la finestra di conservazione
     non ci sono piu' sul cloud: quelle si rimandano dal PC che le ha in archivio. */
  const files = [], mancanti = [];
  try{
    const {data:rulli} = await sb.from("rulli").select("id").eq("servizio_id", a.servizio_id);
    const ids = (rulli||[]).map(r=>r.id);
    let foto = [];
    if(ids.length){
      const {data} = await sb.from("foto").select("codice,originale_url")
        .in("rullo_id", ids).in("codice", codici);
      foto = data || [];
    }
    const perCodice = new Map(foto.map(f=>[f.codice, f.originale_url]));
    for(const c of codici){
      const path = perCodice.get(c);
      if(!path){ mancanti.push(c); continue; }
      try{
        const {data,error} = await sb.storage.from("originali").createSignedUrl(path, 900);
        if(error||!data||!data.signedUrl) mancanti.push(c);
        else files.push({nome:c+".jpg", url:data.signedUrl});
      }catch(_){ mancanti.push(c); }
    }
  }catch(err){
    console.warn("originali reinvio", err);
    invEsito("Non riesco a leggere le foto dal cloud: controlla la connessione.", false);
    b.disabled = false; b.textContent = "Invia di nuovo"; return;
  }

  if(!files.length){
    invEsito("Gli originali di queste foto non sono piu' sul cloud.\nRifai l'invio dal PC che le ha in archivio.", false);
    b.disabled = false; b.textContent = "Invia di nuovo"; return;
  }

  b.textContent = "Invio…";
  invEsito("Invio "+files.length+" foto a "+email+"…", true);
  const nomi = files.map(f=>f.nome.replace(/\.jpg$/i,""));
  try{
    await tieniSchermoAcceso();
    /* Stessa strada dell'invio normale: a gruppetti, per non sforare il tempo del
       server quando il cliente da recuperare aveva scelto molte foto. */
    const apertura = await chiamataInvio("/api/invia-apri", {
      email,
      oggetto:"Le tue foto — Frame About You",
      messaggio:"Grazie per la serata! Ecco le tue foto."
    }, 30000);

    const caricate=[];
    for(let i=0; i<files.length; i+=6){
      const esito = await chiamataInvio("/api/invia-pezzo", {
        transferid: apertura.transferid,
        transferkey: apertura.transferkey,
        transferurl: apertura.transferurl,
        files: files.slice(i, i+6)
      }, 70000);
      caricate.push(...(esito.caricate||[]));
      invEsito("Invio "+caricate.length+" di "+files.length+" foto a "+email+"…", true);
    }
    if(!caricate.length) throw new Error("Nessuna foto è arrivata a destinazione.");

    await chiamataInvio("/api/invia-chiudi", {
      transferid: apertura.transferid,
      transferkey: apertura.transferkey,
      logintoken: apertura.logintoken
    }, 30000);

    await invRegistra(a, nomi, caricate.length, email, "ok",
      mancanti.length ? mancanti.length+" foto non piu' sul cloud" : "");
    invEsito("Inviate "+caricate.length+" foto a "+email+"."
      + (mancanti.length ? "\n"+mancanti.length+" foto non erano piu' sul cloud e non sono partite." : ""), true);
    toast("Foto inviate a "+email);
    setTimeout(invChiudiSheet, 1600);
  }catch(err){
    console.warn("reinvio", err);
    const perche = (err && err.message) ? err.message : String(err);
    await invRegistra(a, nomi, files.length, email, "errore", perche.slice(0,180));
    invEsito("Invio non riuscito: "+perche, false);
  }finally{
    rilasciaSchermo();
    b.disabled = false; b.textContent = "Invia di nuovo";
    await invCarica();
  }
}

/* Ogni reinvio scrive una riga NUOVA: la storia resta intera e si vede che quel
   cliente e' stato recuperato, con quale email e da quale tablet. */
async function invRegistra(a, nomi, quante, email, esito, motivo){
  try{
    await sb.from("attivita").insert({
      servizio_id: a.servizio_id,
      rullo_lettera: a.rullo_lettera || invRulloDi(a),
      codici: nomi.join(", "),
      azione: "~invio",
      quante,
      postazione: nomeTablet(),
      esito,
      dettaglio: email + (motivo ? " — " + motivo : "")
    });
  }catch(_){ /* il registro non deve mai bloccare l'invio */ }
}

/* ---------- comandi ---------- */
$("btnInvii").onclick = ()=>{ $("invDlg").classList.add("on"); renderKO(); invCarica(); };
aggiornaSpiaInvii();   // la spia rossa si accende gia' all'apertura della pagina
$("invClose").onclick = ()=> $("invDlg").classList.remove("on");
$("invGiorni").onchange = invCarica;
$("invCerca").oninput = invRender;
document.querySelectorAll(".ichip").forEach(c=>{
  c.onclick = ()=>{
    document.querySelectorAll(".ichip").forEach(x=>x.classList.remove("on"));
    c.classList.add("on"); INV.filtro = c.dataset.f; invRender();
  };
});
$("invList").onclick = e => { const b=e.target.closest(".iriga"); if(b) invApri(b.dataset.id); };
$("invAnnulla").onclick = invChiudiSheet;
$("invSheet").onclick = e => { if(e.target.id==="invSheet") invChiudiSheet(); };
$("invRifai").onclick = invRifaiInvio;


/* ---------- gesto "indietro" di Android ----------
   La pagina del tablet si apre dalla schermata iniziale (PC / Tablet), quindi il gesto
   indietro — quello che parte scorrendo dal bordo dello schermo — riportava lì proprio
   mentre il cliente aveva il tablet in mano, e sembrava che la pagina si ricaricasse da
   sola. Ora la pagina trattiene il gesto e lo usa per chiudere quello che è aperto:
   prima il visualizzatore, poi i pannelli, poi la selezione. Se non c'è niente da
   chiudere non succede nulla, e non si esce mai per sbaglio. */
function segnaPassoIndietro(){ try{ history.pushState({fay:1}, ""); }catch(_){} }
segnaPassoIndietro();
addEventListener("popstate", ()=>{
  segnaPassoIndietro();                       // il passo consumato si rimette subito
  const ov = $("mailOverlay");
  if(ov && ov.style.display && ov.style.display!=="none"){ ov.style.display="none"; return; }
  if($("grpMenu") && !$("grpMenu").hidden){ chiudiMenuGruppi(); return; }
  if($("invSheet") && $("invSheet").classList.contains("on")){ invChiudiSheet(); return; }
  if($("invDlg") && $("invDlg").classList.contains("on")){ $("invDlg").classList.remove("on"); return; }
  if($("cpSheet") && $("cpSheet").classList.contains("open")){ $("cpSheet").classList.remove("open"); return; }
  if($("grpSheet") && $("grpSheet").classList.contains("open")){ $("grpSheet").classList.remove("open"); return; }
  if($("viewer") && $("viewer").classList.contains("open")){ closeViewer(); return; }
  if(S.gruppo){ S.gruppo=null; render(); return; }         // esce dal gruppo, resta nel rullo
  if(S.selmode){ esciDaSelezione(); return; }
});

/* ---------- codice di accesso ----------
   Chiude la porta a chi si trova il dispositivo in mano o l'indirizzo per caso. Non e' una
   cassaforte: la chiave del database resta dentro la pagina, quindi non protegge i dati da
   chi sa dove guardare (per quello servirebbe un vero accesso su Supabase).
   Il codice sta sul cloud, si cambia dal PC e vale per tutti i dispositivi.
   Regole volute: si chiede UNA volta per dispositivo; se il codice viene cambiato dal PC,
   tutti lo devono reinserire; senza linea, un dispositivo gia' sbloccato entra lo stesso,
   perche' bloccare una vendita per un problema di rete sarebbe peggio del problema. */
const COD_KEY = "faylive_codice_ok";
async function codiceDalCloud(){
  if(!sb) return null;
  try{
    const {data} = await sb.from("impostazioni").select("valore").eq("chiave","codice_accesso").maybeSingle();
    return data ? (data.valore || "") : "";
  }catch(_){ return null; }   // null = non si sa (linea assente)
}
function apriPorta(){ const g=document.getElementById("gate"); if(g) g.style.display="none"; }
function chiediCodice(atteso){
  return new Promise(res=>{
    const g=document.getElementById("gate"), inp=document.getElementById("gateInput"),
          ok=document.getElementById("gateOk"), msg=document.getElementById("gateMsg");
    g.style.display="flex";
    setTimeout(()=>inp.focus(), 100);
    const prova = ()=>{
      if(inp.value === atteso){
        try{ localStorage.setItem(COD_KEY, inp.value); }catch(_){}
        apriPorta(); res(true);
      }else{
        msg.textContent = "Codice errato";
        msg.style.color = "#ff8080";
        inp.value=""; inp.focus();
      }
    };
    ok.onclick = prova;
    inp.onkeydown = e=>{ if(e.key==="Enter") prova(); };
  });
}
async function controllaAccesso(){
  const g=document.getElementById("gate");
  if(g) g.style.display="flex";                 // chiuso finche' non si sa
  const attuale = await codiceDalCloud();
  let salvato = null;
  try{ salvato = localStorage.getItem(COD_KEY); }catch(_){}
  if(attuale === null){                          // linea assente
    if(salvato){ apriPorta(); return true; }     // gia' sbloccato prima: si entra
    const m=document.getElementById("gateMsg");
    if(m){ m.textContent = "Serve la connessione per il primo accesso su questo dispositivo"; m.style.color="#ff8080"; }
    return false;
  }
  if(!attuale){ apriPorta(); return true; }      // nessun codice impostato: aperto
  if(salvato === attuale){ apriPorta(); return true; }
  await chiediCodice(attuale);
  return true;
}

/* avvio: prima la porta, poi l'app. Il codice si cambia dal PC. */
controllaAccesso().then(()=> loadSedi());
if(!sb) setDot(false,"Cloud non disponibile");
