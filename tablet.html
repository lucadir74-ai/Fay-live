<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fay Live — Tablet</title>
<style>
  :root{
    --bg:#0b0e14; --surface:#141922; --surface2:#1c2330; --line:#2a3444;
    --ink:#eef2f8; --muted:#8b97a8; --accent:#e0a008; --fav:#ff3b6b; --ok:#5bc98a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
  body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}

  /* i tasti vanno a capo invece di finire fuori dallo schermo: con 4 tasti l'ultimo
     (Invia) restava tagliato oltre il bordo destro sui tablet più stretti */
  header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface);
    border-bottom:1px solid var(--line);flex-shrink:0;flex-wrap:wrap}
  header h1{font-size:20px;margin:0;font-weight:800}
  header h1 span{color:var(--accent)}
  select{background:var(--surface2);border:1px solid var(--line);border-radius:10px;color:var(--ink);
    padding:10px 12px;font-size:16px;min-height:44px}
  .spacer{flex:1}
  .favtoggle{display:flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--line);
    color:var(--ink);border-radius:10px;padding:9px 14px;font-size:15px;min-height:44px;cursor:pointer;
    font-family:inherit;flex-shrink:0}
  .favtoggle:active{background:var(--line)}
  .favtoggle.on{border-color:var(--fav);color:var(--fav)}
  .favtoggle .heart{font-size:18px}
  .favtoggle.busy{border-color:var(--accent);color:var(--accent);opacity:.75}
  .favtoggle.busy span:first-child{animation:spin .9s linear infinite;display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* schede rullo grandi, scorrevoli */
  nav{display:flex;gap:8px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line);
    overflow-x:auto;flex-shrink:0;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  .rtab{flex:0 0 auto;background:var(--surface2);border:1px solid var(--line);border-radius:12px;
    padding:10px 18px;font-size:16px;font-weight:600;min-height:46px;display:flex;align-items:center;gap:8px}
  .rtab.on{background:var(--accent);color:#1a1200;border-color:var(--accent)}
  .rtab .cnt{font-size:13px;opacity:.7}

  /* griglia a tocco */
  #grid{flex:1;overflow-y:auto;padding:8px;display:grid;gap:8px;
    grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
    grid-auto-rows:170px;align-content:start;-webkit-overflow-scrolling:touch}
  .cell{position:relative;background:#000;border-radius:10px;overflow:hidden;height:170px;width:100%}
  .cell.wide{grid-column:span 2}
  .cell canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block}
  .cell .code{position:absolute;left:5px;bottom:5px;background:rgba(11,14,20,.85);color:var(--accent);
    font-weight:700;font-size:11px;padding:2px 6px;border-radius:5px;font-family:ui-monospace,monospace;z-index:2}
  .cell .fav{position:absolute;right:4px;top:4px;width:30px;height:30px;border-radius:50%;
    background:rgba(11,14,20,.6);display:flex;align-items:center;justify-content:center;font-size:17px;z-index:2}
  .cell .fav.on{color:var(--fav)}
  .cell .fav:not(.on){color:rgba(255,255,255,.85)}
  .cell.isfav{outline:3px solid var(--fav);outline-offset:-3px}
  .cell.sel{outline:4px solid #4a9eff;outline-offset:-4px}
  .rtab.grp{background:#2a2118;border-color:#6b5324}
  .cell .grp{position:absolute;left:6px;top:6px;background:rgba(245,185,66,.92);color:#151109;
    font:600 12px "Segoe UI",sans-serif;padding:2px 7px;border-radius:8px;max-width:70%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* quante copie stampare: foglio che compare quando si manda in stampa */
  #cpSheet{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;z-index:70;
    align-items:flex-end;justify-content:center}
  #cpSheet.open{display:flex}
  #cpBox{background:#151922;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px 26px}
  #cpBox h3{margin:0 0 4px;font-size:20px}
  #cpBox p{margin:0 0 16px;color:var(--muted);font-size:14px}
  #cpQuick{display:flex;gap:10px;margin-bottom:16px}
  #cpQuick button{flex:1;background:#222836;border:1px solid #39415a;color:#e8ecf5;
    padding:18px 0;border-radius:14px;font-size:24px;font-weight:700;font-family:inherit}
  #cpQuick button:active{background:#2f3849}
  #cpAltro{display:flex;align-items:center;gap:12px}
  #cpMeno,#cpPiu{width:56px;height:56px;border-radius:14px;background:#222836;border:1px solid #39415a;
    color:#e8ecf5;font-size:26px;font-family:inherit}
  #cpN{font-size:26px;font-weight:700;min-width:56px;text-align:center}
  #cpOk{background:#F5B942;border:0;color:#151109;padding:16px 18px;border-radius:12px;
    font-size:18px;font-weight:700;font-family:inherit}
  #cpAnnulla{background:transparent;border:1px solid var(--line);color:var(--muted);
    padding:16px 16px;border-radius:12px;font-size:16px;font-family:inherit}
  #grpSheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:60;
    align-items:flex-end;justify-content:center}
  #grpSheet.open{display:flex}
  #grpBox{background:#151922;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px 26px}
  #grpBox h3{margin:0 0 4px;font-size:20px}
  #grpBox p{margin:0 0 14px;color:var(--muted);font-size:14px}
  #grpList{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
  #grpList button{background:#222836;border:1px solid #39415a;color:#e8ecf5;
    padding:12px 16px;border-radius:12px;font-size:17px}
  #grpNew{display:flex;gap:10px}
  #grpNew input{flex:1;background:#0e1218;border:1px solid #39415a;color:#e8ecf5;
    padding:14px;border-radius:12px;font-size:17px}
  #grpNew button,#grpClose,#grpNone{background:#F5B942;border:0;color:#151109;padding:14px 18px;
    border-radius:12px;font-size:17px;font-weight:600}
  #grpNone{background:#39415a;color:#e8ecf5;margin-top:12px;width:100%}
  #grpClose{background:transparent;color:var(--muted);width:100%;margin-top:8px;font-weight:400}
  .cell .selcheck{position:absolute;left:5px;top:5px;width:28px;height:28px;border-radius:50%;
    background:#4a9eff;color:#fff;display:none;align-items:center;justify-content:center;font-size:17px;font-weight:800;z-index:3}
  .cell.sel .selcheck{display:flex}
  body.selmode .cell .fav{display:none}
  body.selmode #grid{touch-action:pan-y;padding-bottom:150px}   /* la barra copre il fondo: lascio spazio */
  /* la barra va a capo: prima i tasti finivano fuori schermo e "Chiudi selezione" spariva */
  #selBar{position:fixed;left:0;right:0;bottom:0;display:none;align-items:center;
    flex-wrap:wrap;gap:10px;
    padding:12px 16px;background:var(--surface);border-top:1px solid var(--line);z-index:40}
  body.selmode #selBar{display:flex}
  #selBar .cnt{margin-right:6px}
  #selDone{background:var(--accent);border-color:var(--accent);color:#151109;font-weight:700}
  body.selmode #status{display:none}
  #selBar .cnt{font-weight:700;font-size:16px}
  #selBar .sb{background:var(--surface2);border:1px solid var(--line);color:var(--ink);
    border-radius:10px;padding:10px 16px;font-size:15px;min-height:44px;font-family:inherit}
  #selBar .sb.act{border-color:var(--accent);color:var(--accent)}

  #empty{margin:auto;color:var(--muted);text-align:center;padding:40px;font-size:16px}

  /* visore a schermo pieno con zoom e swipe */
  #viewer{position:fixed;inset:0;background:#000;display:none;z-index:50;touch-action:none}
  #viewer.open{display:block}
  #viewer canvas{position:absolute;inset:0;width:100%;height:100%}
  #vBar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;
    padding:14px;background:linear-gradient(rgba(0,0,0,.6),transparent);z-index:2}
  #vCode{font-weight:700;font-size:18px;color:#fff;font-family:ui-monospace,monospace;
    background:rgba(0,0,0,.4);padding:4px 12px;border-radius:8px}
  #vClose{margin-left:auto;width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.5);
    border:none;color:#fff;font-size:24px}
  .vAct{background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.25);color:#fff;
    border-radius:22px;padding:9px 16px;font-size:15px;font-family:inherit;min-height:44px}
  .vAct:active{background:rgba(255,255,255,.18)}
  #vFav{position:absolute;right:16px;bottom:24px;width:64px;height:64px;border-radius:50%;
    background:rgba(0,0,0,.55);border:none;font-size:30px;color:#fff;z-index:2;display:flex;
    align-items:center;justify-content:center}
  #vFav.on{color:var(--fav)}
  #vHint{position:absolute;left:0;right:0;bottom:26px;text-align:center;color:rgba(255,255,255,.5);
    font-size:13px;z-index:1;pointer-events:none}

  #status{flex-shrink:0;display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--surface);
    border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
  #dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}
  #dot.off{background:#c0392b}
  /* ---------- Schermata INVII ---------- */
  #invDlg{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;flex-direction:column}
  #invDlg.on{display:flex}
  #invTop{flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 14px}
  #invTop .r1{display:flex;align-items:center;gap:12px}
  #invTop h2{font-size:19px;margin:0;font-weight:800}
  #invTop h2 span{color:var(--accent)}
  #invClose{margin-left:auto;width:44px;height:44px;border-radius:50%;background:var(--surface2);
    border:1px solid var(--line);color:var(--ink);font-size:22px}
  #invTop .r2{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  #invTop .r2 select{flex:0 1 auto}
  #invCerca{flex:1 1 200px;min-width:150px;background:var(--surface2);border:1px solid var(--line);
    border-radius:10px;color:var(--ink);padding:10px 12px;font-size:15px;min-height:44px;font-family:inherit}
  #invChips{display:flex;gap:8px;margin-top:10px}
  .ichip{flex:1;background:var(--surface2);border:1px solid var(--line);color:var(--ink);border-radius:99px;
    padding:9px 6px;min-height:42px;font-size:14px;font-weight:700;font-family:inherit}
  .ichip.on{background:var(--accent);color:#1a1200;border-color:var(--accent)}
  .ichip .n{opacity:.65;font-weight:600}
  #invList{flex:1;overflow:auto;padding:12px 14px 28px;-webkit-overflow-scrolling:touch}
  .ivuoto{color:var(--muted);text-align:center;padding:46px 16px;line-height:1.6}
  .ivuoto b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
  .igiorno{margin-bottom:22px}
  .igiorno>h3{position:sticky;top:-12px;background:var(--bg);z-index:2;margin:0;padding:10px 0 8px;
    font-size:16px;font-weight:800;text-transform:capitalize;border-bottom:2px solid var(--accent);
    display:flex;align-items:baseline;gap:10px}
  .igiorno>h3 .m{font-size:12.5px;font-weight:600;color:var(--muted);text-transform:none}
  .igiorno>h3 .ko{color:#ff8080}
  .irullo{margin-top:12px}
  .irullo>h4{display:flex;align-items:center;gap:9px;margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600}
  .irullo>h4 .lt{font-family:ui-monospace,monospace;font-weight:800;font-size:15px;letter-spacing:1px;
    background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:3px 10px;color:var(--ink)}
  .iriga{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
    border-left:4px solid var(--ok);border-radius:12px;padding:12px 14px;margin-bottom:8px;
    color:var(--ink);font-family:inherit;font-size:15px}
  .iriga:active{background:var(--surface2)}
  .iriga.ko{border-left-color:#e4574f}
  .iriga .l1{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .iriga .ora{font-family:ui-monospace,monospace;color:var(--muted);font-size:13px}
  .iriga .es{font-weight:800;font-size:13px;color:var(--ok)}
  .iriga.ko .es{color:#ff8080}
  .iriga .q{color:var(--muted);font-size:13px}
  .iriga .em{display:block;margin-top:5px;font-weight:700;word-break:break-all}
  .iriga .mo{display:block;margin-top:5px;font-size:12.5px;color:#ff8080}
  .iriga .cd{display:block;margin-top:4px;font-family:ui-monospace,monospace;font-size:12.5px;
    color:var(--muted);word-break:break-all}
  #invSheet{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.72);display:none;align-items:flex-end}
  #invSheet.on{display:flex}
  #invBox{background:var(--surface);width:100%;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;
    padding:8px 18px 24px}
  #invBox .presa{width:44px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 14px}
  #invBox h3{margin:0 0 4px;font-size:18px}
  #invBox .sub{color:var(--muted);font-size:13.5px;margin:0 0 16px}
  #invBox label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
  #invEmail{width:100%;box-sizing:border-box;font-size:19px;padding:14px;border-radius:12px;
    border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:inherit}
  #invCodici{margin-top:14px;font-family:ui-monospace,monospace;font-size:13px;background:var(--bg);
    border:1px solid var(--line);border-radius:10px;padding:11px 12px;word-break:break-all;line-height:1.7}
  #invMsg{margin-top:14px;font-size:14px;line-height:1.5;white-space:pre-line;display:none}
  #invMsg.on{display:block}
  #invMsg.ko{color:#ff8080}
  #invMsg.ok{color:var(--ok)}
  #invAzioni{display:flex;gap:12px;margin-top:18px}
  #invAnnulla{flex:1;font-size:17px;padding:15px;border-radius:12px;border:1px solid var(--line);
    background:transparent;color:var(--muted);font-family:inherit}
  #invRifai{flex:2;font-size:17px;padding:15px;border-radius:12px;border:0;background:#2f7d4f;color:#fff;
    font-weight:700;font-family:inherit}
  #invRifai:disabled{opacity:.5}
  #toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#000;color:#fff;
    padding:10px 18px;border-radius:22px;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none}
  #toast.show{opacity:.95}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <h1>Fay <span>Live</span></h1>
    <select id="sedeSel"><option value="">Sede…</option></select>
    <select id="giornoSel" hidden></select>
    <div class="spacer"></div>
    <button class="favtoggle" id="btnRefresh"><span>⟳</span><span>Aggiorna</span></button>
    <button class="favtoggle" id="favOnly"><span class="heart">♡</span><span>Preferiti</span></button>
    <button class="favtoggle" id="btnShare"><span>↗</span><span>Condividi</span></button>
    <button class="favtoggle" id="btnExport"><span>⬇</span><span>Esporta</span></button>
    <button class="favtoggle" id="btnSend"><span>✈</span><span>Invia</span></button>
    <button class="favtoggle" id="btnPrint"><span>🖨</span><span>Manda in stampa</span></button>
    <button class="favtoggle" id="btnInvii"><span>📋</span><span>Invii</span></button>
    <button class="favtoggle" id="btnFavClear"><span>✕</span><span>Pulisci preferiti</span></button>
  </header>

  <nav id="tabs" hidden></nav>

  <!-- il cliente scrive QUI la propria email, sul tablet che ha già in mano -->
  <div id="mailOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:60;align-items:center;justify-content:center;padding:24px">
    <div style="background:#14161a;border-radius:18px;padding:26px;width:min(560px,100%);box-shadow:0 20px 60px rgba(0,0,0,.6)">
      <div id="mailTitolo" style="font-size:20px;font-weight:700;margin-bottom:6px">Ricevi le tue foto</div>
      <div id="mailSotto" style="opacity:.85;font-size:15px;margin-bottom:14px;max-height:40vh;overflow:auto;
           user-select:text;-webkit-user-select:text;word-break:break-word"></div>
      <button id="mailCopia" hidden style="width:100%;margin-bottom:12px;font-size:15px;padding:12px;border-radius:10px;
              border:1px solid #3a3f47;background:transparent;color:#ddd">Copia il messaggio</button>
      <input id="mailInput" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false"
             placeholder="nome@email.com"
             style="width:100%;box-sizing:border-box;font-size:22px;padding:16px 14px;border-radius:12px;border:1px solid #3a3f47;background:#0c0e11;color:#fff">
      <div id="mailErrore" style="color:#ff8080;font-size:14px;height:20px;margin-top:6px"></div>
      <div style="display:flex;gap:12px;margin-top:14px">
        <button id="mailAnnulla" style="flex:1;font-size:18px;padding:16px;border-radius:12px;border:1px solid #3a3f47;background:transparent;color:#ddd">Annulla</button>
        <button id="mailOk" style="flex:2;font-size:18px;padding:16px;border-radius:12px;border:0;background:#2f7d4f;color:#fff;font-weight:700">Invia le foto</button>
      </div>
    </div>
  </div>
  <div id="grid"></div>
  <div id="empty" hidden>Scegli una sede per vedere le foto</div>

  <div id="status">
    <span id="dot"></span><span id="statusText">Scegli una sede</span>
    <span class="spacer" style="flex:1"></span>
    <button id="prevCount" style="margin-right:14px;background:var(--surface2);border:1px solid var(--line);
            color:var(--muted);border-radius:8px;padding:6px 12px;font-size:13px;font-family:inherit;min-height:34px"></button>
    <span id="favCount"></span>
  </div>

  <div id="viewer">
    <div id="vBar">
      <span id="vCode"></span>
      <button class="vAct" id="vShare">↗ Condividi</button>
      <button class="vAct" id="vExport">⬇ Esporta</button>
      <button class="vAct" id="vSend">✈ Invia</button>
      <button class="vAct" id="vPrint">🖨 Stampa</button>
      <button id="vClose">✕</button>
    </div>
    <canvas id="vCanvas"></canvas>
    <button id="vFav">♡</button>
    <div id="vHint">Scorri per cambiare foto · avvicina le dita per zoomare</div>
  </div>
  <div id="invDlg">
    <div id="invTop">
      <div class="r1">
        <h2>Invii <span>·</span> registro</h2>
        <button id="invClose">✕</button>
      </div>
      <div class="r2">
        <select id="invGiorni">
          <option value="7">Ultimi 7 giorni</option>
          <option value="30" selected>Ultimi 30 giorni</option>
          <option value="90">Ultimi 90 giorni</option>
        </select>
        <input id="invCerca" type="search" placeholder="Cerca email o codice">
      </div>
      <div id="invChips">
        <button class="ichip on" data-f="tutti">Tutti <span class="n" id="invNT"></span></button>
        <button class="ichip" data-f="ok">Riusciti <span class="n" id="invNO"></span></button>
        <button class="ichip" data-f="ko">Non riusciti <span class="n" id="invNK"></span></button>
      </div>
    </div>
    <div id="invList"></div>
  </div>

  <div id="invSheet">
    <div id="invBox">
      <div class="presa"></div>
      <h3 id="invTit">Invio</h3>
      <p class="sub" id="invSub"></p>
      <label for="invEmail">Email del cliente — correggila se era sbagliata</label>
      <input id="invEmail" type="email" inputmode="email" autocapitalize="off" spellcheck="false">
      <div id="invCodici"></div>
      <p id="invMsg"></p>
      <div id="invAzioni">
        <button id="invAnnulla">Chiudi</button>
        <button id="invRifai">Invia di nuovo</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <!-- quante copie: 1 è il caso normale, i tasti mandano in stampa con un tocco solo -->
  <div id="cpSheet">
    <div id="cpBox">
      <h3>Quante copie per foto?</h3>
      <p id="cpSub"></p>
      <div id="cpQuick">
        <button data-n="1">1</button>
        <button data-n="2">2</button>
        <button data-n="3">3</button>
        <button data-n="4">4</button>
        <button data-n="5">5</button>
      </div>
      <div id="cpAltro">
        <button id="cpMeno">−</button>
        <span id="cpN">1</span>
        <button id="cpPiu">+</button>

/* Indicatore anteprime: dice quante foto del rullo aperto sono già guardabili.
   Serve a capire se il PC sta ancora caricando o se quello che vedi è tutto. */
/* Diagnosi rullo: si tocca l'indicatore delle anteprime e dice PERCHÉ un rullo è lento —
   quante foto hanno la miniatura vera, quante caricano l'anteprima grande al posto suo
   (10-20 volte più pesante) e quanto pesano davvero i file di questo rullo. */
async function diagnosiRullo(){
  const scope = S.letter ? S.photos.filter(p=>p.letter===S.letter) : S.photos;
  if(!scope.length){ toast("Nessuna foto in questo rullo"); return; }
  const conMini = scope.filter(p=>p.miniUrl).length;
  const senzaMini = scope.filter(p=>!p.miniUrl && p.bigUrl).length;
  const senzaNulla = scope.filter(p=>!p.miniUrl && !p.bigUrl).length;

  toast("Misuro il peso delle immagini…");
  const conScadenza = (u)=>{
    const ac=new AbortController(); const t=setTimeout(()=>ac.abort(), 8000);
    return fetch(u,{cache:"no-store", signal:ac.signal}).finally(()=>clearTimeout(t));
  };
  // campione: 5 foto sparse nel rullo
  const passo = Math.max(1, Math.floor(scope.length/5));
  const campione = []; for(let i=0;i<scope.length && campione.length<5;i+=passo) campione.push(scope[i]);
  let byte=0, letti=0, errori=0;
  for(const p of campione){
    const u = p.url; if(!u) continue;
    try{
      const r = await conScadenza(u);
      if(!r.ok){ errori++; continue; }
      const b = await r.blob(); byte += b.size; letti++;
    }catch(_){ errori++; }
  }
  const medioKB = letti ? Math.round(byte/letti/1024) : 0;
  const stimaMB = letti ? ((byte/letti)*scope.length/1048576).toFixed(1) : "?";

  alert(
    `DIAGNOSI RULLO ${S.letter || "(tutti)"}\n\n` +
    `Foto: ${scope.length}\n` +
    `Con miniatura vera: ${conMini}\n` +
    `Che usano l'anteprima grande al posto della miniatura: ${senzaMini}\n` +
    `Senza nessuna immagine: ${senzaNulla}\n\n` +
    `Peso medio misurato: ${medioKB} KB a foto\n` +
    `Totale da scaricare per questo rullo: circa ${stimaMB} MB\n` +
    (errori? `Immagini non raggiungibili nel campione: ${errori}\n` : "") +
    `\nSe il peso medio supera i 100 KB, le miniature non sono state generate e il tablet ` +
    `sta scaricando le anteprime grandi: è quello che rallenta.`
  );
}

function aggiornaIndicatoreAnteprime(){
  const el=$("prevCount"); if(!el) return;
  const scope = S.letter ? S.photos.filter(p=>p.letter===S.letter) : S.photos;
  const tot = scope.length;
  if(!tot){ el.textContent=""; return; }
  const pronte = scope.filter(p=>p.url).length;      // ha almeno la miniatura: si vede
  const grandi = scope.filter(p=>p.bigUrl).length;   // apribile a schermo pieno
  if(pronte>=tot && grandi>=tot){
    el.textContent = `✓ ${tot} anteprime`;
    el.style.color = "var(--ok, #4caf50)";
  }else if(pronte>=tot){
    el.textContent = `⇩ ${grandi}/${tot} a schermo pieno`;
    el.style.color = "var(--muted)";
  }else{
    el.textContent = `⇩ ${pronte}/${tot} anteprime`;
    el.style.color = "var(--accent)";
  }
}

/* Supabase restituisce al massimo 1000 righe per volta: con giornate da
   oltre 1000 foto i rulli finali sparivano. Qui leggo a blocchi finché finisce. */
const BLOCCO = 1000;
async function caricaFotoDeiRulli(ids){
  let tutte = [], da = 0;
  while(true){
    const {data, error} = await sb.from("foto").select("*")
      .in("rullo_id", ids).order("codice").range(da, da + BLOCCO - 1);
    if(error) throw error;
    const parte = data || [];
    tutte = tutte.concat(parte);
    if(parte.length < BLOCCO) break;
    da += BLOCCO;
  }
  return tutte;
}

/* ---------- tempo reale ---------- */
function subscribe(){
  if(!S.servizio) return;
  if(S.channel){ try{ sb.removeChannel(S.channel); }catch(_){} S.channel=null; }
  S.channel = sb.channel("tab-"+S.servizio.id+"-"+Date.now())
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"foto"}, async payload=>{
      const f=payload.new;
      const {data:r}=await sb.from("rulli").select("lettera,servizio_id").eq("id",f.rullo_id).single();
      if(!r || r.servizio_id!==S.servizio.id) return;
      if(S.byId.has(f.id)) return;
      const p={ id:f.id, code:f.codice, letter:r.lettera, url:f.mini_url||f.anteprima_url, bigUrl:f.anteprima_url||null, miniUrl:f.mini_url||null, origPath:f.originale_url||null, fav:!!f.preferito, gruppo:f.gruppo||null };
      S.photos.push(p); S.byId.set(p.id,p);
      S.rulli[f.rullo_id]={lettera:r.lettera};
      render();
    })
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"foto"}, payload=>{
      const f=payload.new; const p=S.byId.get(f.id);
      if(p){
        p.fav = favLocali.has(p.id) ? favLocali.get(p.id) : !!f.preferito;
        p.url=f.mini_url||f.anteprima_url||p.url; p.bigUrl=f.anteprima_url||p.bigUrl; p.gruppo=f.gruppo||null;
        /* MANCAVA: quando PC1 finisce di caricare l'originale scrive originale_url e la
           notifica arriva qui — ma non veniva copiata, quindi il tablet continuava a
           credere che la foto non fosse sul cloud. E' la via piu' rapida per saperlo. */
        if(f.originale_url) p.origPath = f.originale_url;
        aggiornaSpiaBadge();
        render();
      }
    })
    .on("postgres_changes",{event:"DELETE",schema:"public",table:"foto"}, payload=>{
      const id=payload.old.id; if(S.byId.has(id)){ S.byId.delete(id); S.photos=S.photos.filter(x=>x.id!==id); render(); }
    })
    .subscribe();
}

/* ---------- rendering griglia ---------- */
// le schede vengono dai rulli della giornata (non dalle foto già scaricate),
// così ci sono tutte anche se le foto stanno ancora arrivando
function letters(){
  const daiRulli = Object.values(S.rulli||{}).map(r=>r&&r.lettera).filter(Boolean);
  const dalleFoto = S.photos.map(p=>p.letter);
  return [...new Set([...daiRulli, ...dalleFoto])].sort();
}
// i gruppi appartengono al rullo in cui sono stati creati: fuori da quel rullo non esistono
function gruppi(){
  if(!S.letter) return [];
  return [...new Set(S.photos.filter(p=>p.letter===S.letter).map(p=>p.gruppo).filter(Boolean))].sort();
}
function visible(){
  let list;
  if(S.gruppo) list = S.photos.filter(p=>p.gruppo===S.gruppo && p.letter===S.letter);   // resta dentro il rullo
  else list = S.letter ? S.photos.filter(p=>p.letter===S.letter) : S.photos;
  if(S.favOnly) list = list.filter(p=>p.fav);
  return list;
}
function render(){
  // schede rullo — niente "Tutte": mille foto in una griglia sola rallentano il tablet
  const ls=letters(); const nav=$("tabs"); nav.hidden=ls.length===0;
  if(ls.length && (!S.letter || !ls.includes(S.letter))){ S.letter = ls[0]; S.gruppo = null; }
  const scope = S.photos.filter(p=>p.letter===S.letter);
  const cnt = L => S.photos.filter(p=>p.letter===L).length;
  nav.innerHTML =
    ls.map(L=>`<div class="rtab ${(!S.gruppo&&S.letter===L)?'on':''}" data-l="${L}">${L} <span class="cnt">${cnt(L)}</span></div>`).join("")+
    gruppi().map(G=>`<div class="rtab grp ${S.gruppo===G?'on':''}" data-g="${esc(G)}">📁 ${esc(G)} <span class="cnt">${S.photos.filter(p=>p.gruppo===G && p.letter===S.letter).length}</span></div>`).join("");
  nav.querySelectorAll(".rtab").forEach(b=>b.onclick=()=>{
    if(b.dataset.g !== undefined){ S.gruppo=b.dataset.g; }
    else { S.gruppo=null; S.letter=b.dataset.l||S.letter; }
    render(); $("grid").scrollTop=0;
  });

  // conteggio preferiti (del rullo attivo) — lo scrive aggiornaSpiaBadge, che ci aggiunge
  // anche lo stato "pronte X/Y": scriverlo qui a mano cancellava la spia a ogni ridisegno
  aggiornaSpiaBadge();
  $("favOnly").classList.toggle("on", S.favOnly);
  // dentro la vista preferiti il tasto dice come uscirne
  $("favOnly").lastElementChild.textContent = S.favOnly ? "Chiudi preferiti" : "Preferiti";
  $("favOnly").querySelector(".heart").textContent = S.favOnly ? "♥" : "♡";
  aggiornaIndicatoreAnteprime();

  // griglia
  const list=visible(); const g=$("grid");
  $("empty").hidden = !!S.sede;
  if(!S.sede){ g.innerHTML=""; lastGrid=""; return; }
  if(!list.length){ g.innerHTML=`<div id="empty2" style="grid-column:1/-1;color:var(--muted);text-align:center;padding:40px">${S.favOnly?'Nessun preferito selezionato':'Nessuna foto'}</div>`; lastGrid=""; return; }
  // se la griglia è identica a quella già disegnata, non la rifaccio: il controllo automatico
  // ogni 25 secondi ricostruiva tutto e faceva ridisegnare le anteprime da capo
  const firma = S.letter+"|"+S.gruppo+"|"+(S.favOnly?"1":"0")+"|"+
                list.map(p=>p.id+(p.fav?"♥":"")+(p.gruppo||"")+(p.wide?"w":"")).join(",");
  if(firma===lastGrid && g.childElementCount){ updateSelBar(); return; }
  lastGrid = firma;
  resetLazy();
  g.innerHTML = list.map((p,i)=>`
    <div class="cell ${p.wide?'wide':''} ${p.fav?'isfav':''} ${S.selected.has(p.id)?'sel':''}" data-i="${i}" data-id="${p.id}">
      <canvas data-code="${p.code}"></canvas>
      <span class="code">${p.code}</span>
      ${(p.gruppo && S.letter)?`<span class="grp">${esc(p.gruppo)}</span>`:""}
      <div class="selcheck">✓</div>
      <div class="fav ${p.fav?'on':''}" data-fav="${p.id}">${p.fav?'♥':'♡'}</div>
    </div>`).join("");
  g.querySelectorAll(".cell").forEach(c=>{
    const i=+c.dataset.i;
    const p=list[i];
    c.querySelector(".fav").onclick=ev=>{ ev.stopPropagation(); toggleFav(p); };
    const cv=c.querySelector("canvas");
    const codeEl=c.querySelector(".code");
    const onTap=()=>{
      if(S.selmode){ toggleSelect(p, c); }
      else openViewer(p);
    };
    cv.onclick=onTap;
    codeEl.onclick=onTap;
    // tocco prolungato → entra in selezione con questa foto
    let lpTimer=null;
    const startLP=()=>{ if(S.selmode) return; lpTimer=setTimeout(()=>{ enterSelMode(p, c); lpTimer=null; }, 400); };
    const cancelLP=()=>{ if(lpTimer){ clearTimeout(lpTimer); lpTimer=null; } };
    c.addEventListener("touchstart", startLP, {passive:true});
    c.addEventListener("touchmove", cancelLP, {passive:true});
    c.addEventListener("touchend", cancelLP, {passive:true});
    // la foto si scarica solo quando la cella sta per entrare in vista
    observeCell(c);
  });
  updateSelBar();
}

function toggleSelect(p, cell){
  if(S.selected.has(p.id)) S.selected.delete(p.id); else S.selected.add(p.id);
  cell.classList.toggle("sel", S.selected.has(p.id));
  updateSelBar();
}
function enterSelMode(p, cell){
  if(navigator.vibrate) navigator.vibrate(30);
  S.selmode=true; document.body.classList.add("selmode");
  S.selected.clear(); S.selected.add(p.id);
  cell.classList.add("sel");
  updateSelBar();
}
function updateSelBar(){
  const n=S.selected.size;
  const el=$("selCnt"); if(el) el.textContent = n ? (n+" selezionate") : "nessuna selezionata";
  const b=$("selNone"); if(b){ b.disabled = !n; b.style.opacity = n ? "1" : ".45"; }

function selectedPhotos(){ return [...S.selected].map(id=>S.byId.get(id)).filter(Boolean); }

/* Uscita dalla selezione: le spunte vanno tolte a mano dalle celle, perché render()
   riusa la griglia già disegnata quando rullo, gruppo e filtri non sono cambiati e
   quindi i segni blu restavano accesi. */
function esciDaSelezione(){
  S.selmode=false; document.body.classList.remove("selmode");
  S.selected.clear();
  document.querySelectorAll("#grid .cell.sel").forEach(c=>c.classList.remove("sel"));
  updateSelBar();
  render();

  updateSelBar();

   si riparte da zero senza dover uscire e rifare la pressione lunga. */

/* ---------- gruppi (sotto-cartelle della giornata) ---------- */
function apriGruppi(){
  const ps=selectedPhotos();
  if(!ps.length){ toast("Nessuna foto selezionata"); return; }
  // i gruppi vivono dentro un rullo: da "Tutte" non si crea nulla
  if(!S.letter){ toast("Scegli prima un rullo"); return; }
  $("grpCount").textContent = (ps.length===1 ? "1 foto selezionata" : ps.length+" foto selezionate")+" · rullo "+S.letter;
  const list=$("grpList");
  const gs=gruppi();
  list.innerHTML = gs.length ? gs.map(g=>`<button data-g="${esc(g)}">📁 ${esc(g)}</button>`).join("")
                             : `<span style="color:var(--muted)">Nessun gruppo ancora — creane uno qui sotto</span>`;
  list.querySelectorAll("button").forEach(b=> b.onclick=()=> assegnaGruppo(b.dataset.g));
  $("grpName").value="";
  $("grpSheet").classList.add("open");
}
async function assegnaGruppo(nome){
  const tutte=selectedPhotos();
  $("grpSheet").classList.remove("open");
  if(!tutte.length) return;
  // sicurezza: se la selezione contiene foto di altri rulli, le lascio fuori
  const ps = S.letter ? tutte.filter(p=>p.letter===S.letter) : tutte;
  const escluse = tutte.length - ps.length;
  if(!ps.length){ toast("Nessuna foto del rullo "+S.letter+" tra quelle selezionate"); return; }
  const ids=ps.map(p=>p.id);
  try{
    const {error} = await sb.from("foto").update({gruppo: nome}).in("id", ids);
    if(error) throw error;
    ps.forEach(p=> p.gruppo = nome);
    toast((nome ? `${ps.length} foto nel gruppo "${nome}"` : `${ps.length} foto tolte dal gruppo`)
          + (escluse ? ` · ${escluse} di altri rulli non toccate` : ""));
  }catch(err){
    console.warn("assegnaGruppo", err);
    toast("Non riesco a salvare il gruppo: " + (err.message||err));
    return;
  }
  esciDaSelezione();
}
$("selGroup").onclick = apriGruppi;
$("grpAdd").onclick = ()=>{
  const n = $("grpName").value.trim();
  if(!n){ toast("Scrivi un nome"); return; }

};

/* Quante copie stampare. Il foglio si apre a ogni "manda in stampa": i tasti 1-5 mandano
   subito (un tocco solo), il − + serve per numeri più alti. Chiudendo si annulla tutto.
   Il numero viaggia sul cloud nella colonna `copie` e il PC lo mostra nella lista. */
const CP = { risolvi:null, n:1 };
function chiediCopie(sub){
  return new Promise(res=>{
    CP.risolvi = res; CP.n = 1;
    $("cpSub").textContent = sub || "";

}

$("cpMeno").onclick  = ()=>{ CP.n=Math.max(1,CP.n-1); $("cpN").textContent=CP.n; };

$("cpAnnulla").onclick = ()=> chiudiCopie(null);
$("cpSheet").onclick = e=>{ if(e.target.id==="cpSheet") chiudiCopie(null); };

// registra un'attività sul cloud (per il report lato PC)
function nomeTablet(){
  let n = localStorage.getItem("faylive_postazione");
  if(!n){ n = "Tablet-" + Math.random().toString(36).slice(2,5).toUpperCase(); localStorage.setItem("faylive_postazione", n); }
  return n;
}
async function logActivity(list, azione, extra){
  if(!sb || !S.servizio || !list.length) return;
  try{
    await sb.from("attivita").insert({
      servizio_id: S.servizio.id,
      rullo_lettera: S.letter || list[0].letter || "",
      codici: list.map(p=>p.code).join(", "),
      azione, quante: list.length,
      postazione: nomeTablet(),
      esito: (extra&&extra.esito) || "ok",
      dettaglio: (extra&&extra.dettaglio) || null
    });
  }catch(_){}
}
/* Righe tecniche: stessa tabella, azione con "~" davanti, così restano fuori dal
   report venditori e finiscono nel Registro tecnico del PC. */
function logTecnico(list, azione, extra){ return logActivity(list, "~"+azione, extra); }
/* ---------- caricamento a scorrimento ----------
   Prima il tablet scaricava e decodificava TUTTE le anteprime della griglia in una volta:
   con 500 foto sono ~50 MB su hotspot e centinaia di immagini decodificate in memoria.
   Ora si carica solo quello che sta per entrare in vista, poche alla volta. */
let lazyObs = null;
let lastGrid = "";              // firma della griglia già disegnata
const drawQueue = [];
let drawActive = 0;
const DRAW_PARALLEL = 8;        // quante miniature scarico/disegno insieme (sono ~25 KB)

function resetLazy(){
  if(lazyObs){ try{ lazyObs.disconnect(); }catch(_){} }
  drawQueue.length = 0;         // butto via il lavoro della griglia precedente
  lazyObs = new IntersectionObserver(entries=>{
    for(const en of entries){
      if(!en.isIntersecting) continue;
      const cell = en.target;
      lazyObs.unobserve(cell);
      const p = S.byId.get(cell.dataset.id);
      const cv = cell.querySelector("canvas");
      if(p && cv) queueDraw(cv, p);
    }
    /* 2000px invece di 600: alla velocita' con cui si scorre col dito, 600px sono meno
       di quattro righe e la griglia arriva sempre dopo il pollice. Le miniature pesano
       ~25 KB, quindi anticipare costa poco e toglie il nero. */
  }, { root: $("grid"), rootMargin: "2000px 0px" });
}
function observeCell(cell){ if(lazyObs) lazyObs.observe(cell); }
function queueDraw(cv, p){
  /* Se la miniatura e' GIA' decodificata in memoria non deve rifare la fila dietro ai
     download: si disegna subito. Prima, dopo ogni ridisegno della griglia, anche le foto
     gia' scaricate ripartivano nere finche' non arrivava il loro turno. */
  if(p && p.url && thumbBmpCache.has(p.url)){ disegnaSubito(cv, p, thumbBmpCache.get(p.url)); return; }
  drawQueue.push([cv, p]); pumpDraw();
}
function disegnaSubito(cv, p, bmp){
  try{
    if(!cv.isConnected || cv.dataset.code !== p.code) return;
    if(bmp.width > bmp.height*1.15){
      p.wide = true;
      const cell=cv.closest(".cell"); if(cell && !cell.classList.contains("wide")) cell.classList.add("wide");
    }
    const rect=cv.getBoundingClientRect();
    if(rect.width<2 || rect.height<2){ drawQueue.push([cv,p]); pumpDraw(); return; }
    const dpr=Math.min(devicePixelRatio||1, 2);
    cv.width=Math.round(rect.width*dpr); cv.height=Math.round(rect.height*dpr);
    const ctx=cv.getContext("2d");
    ctx.fillStyle="#1a1a1a"; ctx.fillRect(0,0,cv.width,cv.height);
    const k=Math.min(cv.width/bmp.width, cv.height/bmp.height);
    const w=bmp.width*k, h=bmp.height*k;
    ctx.drawImage(bmp,(cv.width-w)/2,(cv.height-h)/2,w,h);
    cv.dataset.drawn="1";
  }catch(_){ drawQueue.push([cv,p]); pumpDraw(); }
}
function pumpDraw(){
  while(drawActive < DRAW_PARALLEL && drawQueue.length){
    const [cv, p] = drawQueue.shift();
    if(!cv.isConnected) continue;              // cella già sostituita da un nuovo render
    drawActive++;
    drawThumb(cv, p).then(ok=>{
      if(ok === false) riprovaCella(cv, p);
    }).finally(()=>{ drawActive--; pumpDraw(); });
  }
}

// disegna l'anteprima su canvas.
// Si scarica il file e si decodifica con createImageBitmap: l'<img> con decode() su Android
// a volte si considera pronta quando non lo è, ed è così che uscivano le foto tagliate a metà.
// Si decodifica anche PICCOLA (la cella è ~110px, non serve un'immagine da 1280): meno memoria e più velocità.
const thumbBmpCache = new Map();
const BMP_W = 340;
/* Riprova una cella rimasta senza immagine: attese crescenti, senza mai arrendersi
   finché la cella è ancora sullo schermo. */
function riprovaCella(cv, p){
  if(!cv.isConnected || cv.dataset.code !== p.code) return;
  p._thumbErr = (p._thumbErr||0) + 1;
  const attesa = Math.min(1500 * p._thumbErr, 20000);
  setTimeout(()=>{
    if(!cv.isConnected || cv.dataset.code !== p.code) return;
    queueDraw(cv, p);
  }, attesa);
}

async function drawThumb(cv, p){
  // la cella può essere stata riusata da un nuovo render mentre scaricavo: se il codice
  // non corrisponde più, non disegno, altrimenti si vedrebbe una foto sotto il codice sbagliato
  if(cv.dataset.code !== p.code) return;
  if(!p.url) return false;                 // non c'è ancora l'anteprima sul cloud: si riproverà
  try{
    let bmp = thumbBmpCache.get(p.url);
    if(!bmp){
      /* Prima, se la richiesta falliva o restava appesa, la cella restava NERA per sempre:
         l'osservatore l'aveva già dimenticata e nessuno riprovava. Sull'hotspot succede
         spesso. Ora ogni richiesta ha una scadenza e si riprova, diradando i tentativi. */
      const ac = new AbortController();
      const scad = setTimeout(()=>ac.abort(), 12000);
      let r;
      try{ r = await fetch(p.url, {signal: ac.signal}); }
      finally{ clearTimeout(scad); }
      if(!r.ok) throw new Error("HTTP "+r.status);
      const blob = await r.blob();
      try{ bmp = await createImageBitmap(blob, {resizeWidth:BMP_W, resizeQuality:"medium"}); }
      catch(_){ bmp = await createImageBitmap(blob); }
      thumbBmpCache.set(p.url, bmp);
      if(thumbBmpCache.size>400){
        const k = thumbBmpCache.keys().next().value;
        const vecchia = thumbBmpCache.get(k);
        thumbBmpCache.delete(k);
        try{ vecchia.close && vecchia.close(); }catch(_){}
      }
    }
    await new Promise(r=>requestAnimationFrame(r)); // aspetta che il layout sia pronto
    // foto orizzontale → cella larga (span 2) così non resta piccola
    if(bmp.width > bmp.height*1.15){
      p.wide = true;   // me lo ricordo: al prossimo render la cella nasce già larga, senza salti
      const cell=cv.closest(".cell"); if(cell && !cell.classList.contains("wide")){ cell.classList.add("wide"); await new Promise(r=>requestAnimationFrame(r)); }
    }
    const rect=cv.getBoundingClientRect();
    if(rect.width<2 || rect.height<2) return;
    if(cv.dataset.code !== p.code || !cv.isConnected) return;   // ricontrollo dopo le attese
    const dpr=Math.min(devicePixelRatio||1, 2);
    cv.width=Math.round(rect.width*dpr);
    cv.height=Math.round(rect.height*dpr);
    const ctx=cv.getContext("2d");
    ctx.fillStyle="#1a1a1a"; ctx.fillRect(0,0,cv.width,cv.height);
    const k=Math.min(cv.width/bmp.width, cv.height/bmp.height);
    const w=bmp.width*k, h=bmp.height*k;
    ctx.drawImage(bmp, (cv.width-w)/2, (cv.height-h)/2, w, h);
    cv.dataset.drawn="1";
    p._thumbErr = 0;
    return true;
  }catch(err){
    console.warn("miniatura", p.code, err && err.message);
    return false;                 // la cella verrà riprovata invece di restare nera
  }
}
function esc(s){ return (s||"").replace(/[<>&"]/g,""); }

/* ---------- preferiti (sincronizzati col PC via campo preferito) ----------
   I preferiti sono la memoria della scelta del cliente e NON devono mai sparire da soli:
   né quando si aggiorna, né dopo un invio. Si azzerano solo col tasto "Pulisci preferiti".
   Quello che il cloud non ha ancora registrato (linea caduta) resta qui e vince
   sul valore letto dal database al prossimo aggiornamento. */
const favLocali = new Map();          // id foto -> true/false scelto su QUESTO tablet
/* Le scelte restano scritte anche nella memoria del tablet: se la pagina viene ricaricata
   (aggiornamento del browser, schermo che si riavvia, app chiusa per sbaglio) i cuori
   tornano tutti al loro posto senza dipendere da cosa è riuscito ad arrivare sul cloud.
   La chiave è per giornata, e le giornate vecchie si buttano da sole dopo due settimane. */
const FAV_KEY = "faylive_fav_";
let favChiave = null;                 // chiave della giornata aperta ora
function pulisciFavVecchi(){
  const limite = Date.now() - 14*24*3600*1000;
  for(let i=localStorage.length-1; i>=0; i--){
    const k = localStorage.key(i);
    if(!k || !k.startsWith(FAV_KEY)) continue;
    try{ const o=JSON.parse(localStorage.getItem(k)); if(!o || !o.t || o.t < limite) localStorage.removeItem(k); }
    catch(_){ localStorage.removeItem(k); }
  }
}
function caricaFavSalvati(servizioId){
  favLocali.clear();
  favChiave = servizioId ? FAV_KEY+servizioId : null;
  pulisciFavVecchi();
  if(!favChiave) return;
  try{
    const o = JSON.parse(localStorage.getItem(favChiave)||"null");
    (o && o.v || []).forEach(([id,val])=> favLocali.set(id, !!val));
  }catch(_){}
}
function salvaFavSalvati(){
  if(!favChiave) return;
  try{ localStorage.setItem(favChiave, JSON.stringify({t:Date.now(), v:[...favLocali]})); }catch(_){}
}
function ricordaFav(p){ favLocali.set(p.id, p.fav); salvaFavSalvati(); }
function applicaFavLocali(lista){ lista.forEach(p=>{ if(favLocali.has(p.id)) p.fav = favLocali.get(p.id); }); }

async function toggleFav(p){
  p.fav=!p.fav;
  ricordaFav(p);
  // aggiorna solo questa cella, senza ridisegnare tutta la griglia
  const cell=document.querySelector('#grid .cell[data-id="'+p.id+'"]');
  if(cell){
    cell.classList.toggle("isfav", p.fav);
    const fav=cell.querySelector(".fav");
    if(fav){ fav.classList.toggle("on", p.fav); fav.textContent=p.fav?'♥':'♡'; }
  }
  // aggiorna il contatore preferiti in alto
  const scope = S.letter ? S.photos.filter(x=>x.letter===S.letter) : S.photos;
  aggiornaSpiaBadge();
  // se sto guardando solo i preferiti e ne tolgo uno, aggiorno la vista
  if(S.favOnly && !p.fav){ lastGrid=""; render(); }
  else lastGrid="";   // la cella è già aggiornata a mano, ma la firma non deve restare vecchia
  if(sb){
    try{
      /* PREFETCH: mettendo il cuore chiedo GIA' ORA l'originale a PC1, nella stessa
         scrittura (nessuna richiesta di rete in piu'). Cosi' il caricamento avviene
         mentre il cliente continua a sfogliare, invece che davanti a lui alla pressione
         di Invia. Stessa banda di prima: si chiedono solo le foto scelte, non tutte. */
      const campi = {preferito:p.fav};
      if(p.fav && !p.origPath) campi.richiesta_originale = true;
      const {error} = await sb.from("foto").update(campi).eq("id",p.id);
      if(error) throw error;
      salvaFavSalvati();             // cloud allineato; la copia locale resta per i ricaricamenti
      if(campi.richiesta_originale){ avviaSpiaOriginali(); logTecnico([p], "originale richiesto"); }
    }catch(_){ toast("Preferito salvato qui, lo sincronizzo appena torna la linea"); }
  }
}

/* Spia leggera: finche' ci sono preferiti senza originale pronto, ogni 8 secondi
   controllo se PC1 li ha caricati e me lo segno. Una sola query, pochi byte.
   Quando sono tutti pronti si spegne da sola. */
let spiaOrig = null;
function avviaSpiaOriginali(){
  if(spiaOrig || !sb) return;
  spiaOrig = setInterval(async ()=>{
    const attesa = S.photos.filter(p=>p.fav && !haOriginale(p));
    if(!attesa.length){ clearInterval(spiaOrig); spiaOrig=null; aggiornaSpiaBadge(); return; }
    try{
      const {data} = await sb.from("foto").select("id,originale_url").in("id", attesa.map(p=>p.id));
      (data||[]).forEach(row=>{
        if(row.originale_url){ const p=S.byId.get(row.id); if(p) p.origPath=row.originale_url; }
      });
    }catch(_){}
    aggiornaSpiaBadge();
  }, 8000);
}
/* Indicatore sempre visibile accanto al contatore preferiti: il venditore sa PRIMA di
   alzarsi se le foto scelte sono pronte da inviare, invece di scoprirlo al tavolo. */
function aggiornaSpiaBadge(){
  const el = $("favCount"); if(!el) return;
  const scope = S.letter ? S.photos.filter(x=>x.letter===S.letter) : S.photos;
  const favs = scope.filter(x=>x.fav);
  if(!favs.length){ el.textContent=""; return; }
  const pronte = favs.filter(p=>haOriginale(p)).length;
  const base = `♥ ${favs.length} preferiti${S.letter? " ("+S.letter+")":""}`;
  el.textContent = pronte>=favs.length ? base+" · pronte ✓" : base+` · pronte ${pronte}/${favs.length}`;
}
$("favOnly").onclick=()=>{ S.favOnly=!S.favOnly; render(); };

/* Unico modo per azzerare i preferiti: esplicito, e solo sul rullo che stai guardando. */
$("btnFavClear").onclick = async ()=>{
  const scope = S.letter ? S.photos.filter(p=>p.letter===S.letter) : S.photos;
  const favs = scope.filter(p=>p.fav);
  if(!favs.length){ toast("Non ci sono preferiti da pulire"+(S.letter?" nel rullo "+S.letter:"")); return; }
  if(!confirm(`Tolgo i ${favs.length} preferiti${S.letter? " del rullo "+S.letter : ""}?`)) return;
  favs.forEach(p=>{ p.fav=false; favLocali.set(p.id,false); });
  salvaFavSalvati();
  S.favOnly=false; lastGrid=""; render();
  if(sb){
    for(const p of favs){
      try{
        await sb.from("foto").update({preferito:false}).eq("id",p.id);
      }catch(_){}
    }
  }
  toast(`${favs.length} preferiti tolti`);
};

// recupera il blob di una foto: originale dal cloud se c'è, altrimenti anteprima
/* Quello che finisce in mano al cliente dev'essere SEMPRE l'originale.
   Il ripiego sull'anteprima resta solo per usi interni (mai per condividi/esporta/invia):
   un file da 1280 px consegnato come foto acquistata è un danno che non si recupera. */
async function photoBlob(p, soloOriginale=true){
  p = vivo(p);
  if(p.origPath && sb){ try{ const dl=await sb.storage.from("originali").download(p.origPath); if(!dl.error) return dl.data; }catch(_){} }
  if(soloOriginale) return null;
  try{ const r=await fetch(p.bigUrl || p.url); if(r.ok) return await r.blob(); }catch(_){}
  return null;
}

// avvisa quando alcune foto non hanno l'originale pronto: si salta, non si ripiega
function avvisaSenzaOriginale(mancanti){
  if(!mancanti.length) return;
  const codici = mancanti.slice(0,8).map(p=>p.code).join(", ") + (mancanti.length>8 ? "…" : "");
  alert(`${mancanti.length} foto NON hanno ancora l'originale sul cloud e sono state saltate:\n\n${codici}\n\n` +
        `Non vengono mai consegnate in bassa risoluzione. Aspetta che il PC le carichi e riprova.`);
}

/* SCHERMO SEMPRE ACCESO DURANTE L'ATTESA.
   Quando lo schermo del tablet si spegne, Android sospende la pagina: i controlli si
   fermano, il download degli originali resta congelato a meta' e al risveglio l'invio
   risulta fallito anche se PC1 aveva caricato tutto. Finche' si aspettano originali o
   si sta inviando, si tiene lo schermo acceso a forza. */
let bloccoSchermo = null;
async function tieniSchermoAcceso(){
  try{
    if(!("wakeLock" in navigator) || bloccoSchermo) return;
    bloccoSchermo = await navigator.wakeLock.request("screen");
    bloccoSchermo.addEventListener("release", ()=>{ bloccoSchermo=null; });
  }catch(_){ bloccoSchermo=null; }
}
function rilasciaSchermo(){
  try{ if(bloccoSchermo) bloccoSchermo.release(); }catch(_){}
  bloccoSchermo = null;
}
/* Android rilascia il blocco da solo quando si cambia app: se torniamo qui mentre
   c'e' ancora un'attesa in corso, lo si riprende. */
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState==="visible" && attesaInCorso) tieniSchermoAcceso();
});
let attesaInCorso = false;

// chiede a PC1 di caricare gli originali mancanti e aspetta che siano pronti
/* Le foto vanno SEMPRE ricercate per id nella mappa viva: la ricarica periodica
   sostituisce tutti gli oggetti con altri nuovi, e chi teneva in mano i vecchi vedeva
   arrivare l'indirizzo dell'originale su copie ormai buttate via. Era questo a inchiodare
   il contatore a 0: il file c'era, ma lo si cercava nell'oggetto sbagliato. */
function vivo(p){ return S.byId.get(p && p.id) || p; }
function haOriginale(p){ const v = vivo(p); return !!(v && v.origPath); }

async function ensureOriginals(list){
  const missing = list.filter(p=>!haOriginale(p));
  if(!missing.length || !sb) return;
  // segna la richiesta sul cloud → PC1 la vede e carica
  for(const p of missing){ try{ await sb.from("foto").update({richiesta_originale:true}).eq("id",p.id); }catch(_){} }
  toast("Preparo gli originali…");
  attesaInCorso = true; await tieniSchermoAcceso();
  const t0Attesa = Date.now();
  /* La scadenza NON puo' essere fissa: 30 secondi bastavano per 4 foto e facevano
     fallire un invio da 5 che stava solo andando piano. Ogni originale e' ~2 MB e su
     hotspot viaggia a poche centinaia di KB/s, quindi il tempo cresce col numero di
     foto. Qui si concede il tempo che serve davvero, con un tetto di 5 minuti. */
  const ids = missing.map(p=>p.id);
  const attesaMs = Math.min(300000, Math.max(45000, 15000 + missing.length*15000));
  let deadline = Date.now()+attesaMs;
  let ultimoProgresso = Date.now(), prontePrima = 0;
  while(Date.now()<deadline){
    const {data} = await sb.from("foto").select("id,originale_url").in("id",ids);
    (data||[]).forEach(row=>{
      if(!row.originale_url) return;
      const p = S.byId.get(row.id); if(p) p.origPath = row.originale_url;   // oggetto vivo
      const q = list.find(x=>x.id===row.id); if(q) q.origPath = row.originale_url;  // e la copia in mano
    });
    aggiornaSpiaBadge();
    const restanti = missing.filter(p=>!haOriginale(p)).length;
    if(!restanti) break;
    const pronte = missing.length-restanti;
    if(missing.length>1) toast(`Preparo gli originali… ${pronte}/${missing.length}`);
    /* Finche' PC1 fa progressi non lo si interrompe: la scadenza si sposta in avanti.
       Ci si arrende solo se per 40 secondi di fila non arriva piu' niente — quello si'
       che significa che dall'altra parte non sta caricando nessuno. */
    if(pronte > prontePrima){ prontePrima = pronte; ultimoProgresso = Date.now(); deadline = Date.now()+attesaMs; }
    else if(document.visibilityState !== "visible"){ ultimoProgresso = Date.now(); deadline = Date.now()+attesaMs; }
    /* PC1 concede fino a ~4 minuti per un singolo file su hotspot lento: se qui ci si
       arrende dopo 40 secondi si molla mentre l'altro sta ancora caricando, e le foto
       arrivano sul cloud subito DOPO l'invio parziale. I due tempi devono essere
       coerenti, altrimenti il tablet spedisce meta' selezione senza motivo. */
    else if(Date.now()-ultimoProgresso > 180000){ break; }
    await new Promise(r=>setTimeout(r,500));
  }
  attesaInCorso = false; rilasciaSchermo();
  const restanti = missing.filter(p=>!haOriginale(p));
  logTecnico(missing, "attesa originali", {
    esito: restanti.length ? "errore" : "ok",
    dettaglio: `${missing.length-restanti.length}/${missing.length} pronte in ${Math.round((Date.now()-t0Attesa)/1000)} s` +
               (restanti.length ? " — mancano: "+restanti.map(p=>p.code).join(", ") : "")
  });
}

// condividi una lista di foto tramite il menu Android (Gmail, FileMail, WhatsApp…)
async function sharePhotos(list, ctx){
  if(!list.length){ toast("Nessuna foto da condividere"+(ctx||"")); return; }
  if(!navigator.canShare){ toast("Condivisione non supportata — usa Esporta"); return; }
  await ensureOriginals(list);
  toast(`Preparo ${list.length} foto…`);
  const files=[], mancanti=[];
  for(const p of list){
    const b = await photoBlob(p, true);          // solo originale, mai l'anteprima
    if(b) files.push(new File([b], p.code+".jpg", {type:"image/jpeg"}));
    else mancanti.push(p);
  }
  avvisaSenzaOriginale(mancanti);
  if(!files.length){ toast("Nessun originale disponibile: niente da condividere"); return; }
  try{
    if(navigator.canShare({files})){ await navigator.share({files, title:"Foto Fay Live"}); return; }
  }catch(err){ if(err && err.name==="AbortError") return; }
  toast("Troppe foto per la condivisione diretta — usa Esporta e allega dai Download");
}

   funzione su Vercel, che prende i file da Supabase e li manda a Filemail. Sull'hotspot

function chiediEmail(quante){
  return new Promise(res=>{
    const ov=$("mailOverlay"), inp=$("mailInput"), err=$("mailErrore");
    $("mailSotto").textContent = `${quante} foto — scrivi la tua email, ti arriva un link per scaricarle.`;

    $("mailOk").onclick=()=>{
      const v=inp.value.trim();
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)){ err.textContent="Controlla l'indirizzo email"; return; }
      chiudi(v);
    };
    inp.onkeydown=e=>{ if(e.key==="Enter") $("mailOk").click(); };
  });
}

async function inviaConFilemail(list, ctx){
  if(!list.length){ toast("Nessuna foto da inviare"+(ctx||"")); return; }
  if(!sb || !S.servizio){ mostraEsito("Cloud non raggiungibile: controlla la connessione.","Invio non riuscito"); return; }
  const email = await chiediEmail(list.length);
  if(!email) return;

  toast("Preparo gli originali…");
  await ensureOriginals(list);

  /* Controllo finale: tra la fine dell'attesa e l'invio possono essere arrivati altri
     originali. Meglio una query in piu' che spedire al cliente meta' delle sue foto. */
  try{
    const senza = list.filter(p=>!haOriginale(p));
    if(senza.length && sb){
      const {data} = await sb.from("foto").select("id,originale_url").in("id", senza.map(p=>p.id));
      (data||[]).forEach(row=>{
        if(!row.originale_url) return;
        const v = S.byId.get(row.id); if(v) v.origPath = row.originale_url;
        const q = list.find(x=>x.id===row.id); if(q) q.origPath = row.originale_url;
      });
    }
  }catch(_){}

  const files=[], mancanti=[];
  for(const pRaw of list){
    const p = vivo(pRaw);
    if(!p.origPath){ mancanti.push(p.code); continue; }
    try{
      const {data,error}=await sb.storage.from("originali").createSignedUrl(p.origPath, 900);
      if(error||!data||!data.signedUrl){ mancanti.push(p.code); continue; }
      files.push({nome:p.code+".jpg", url:data.signedUrl});
    }catch(_){ mancanti.push(p.code); }
  }
  if(!files.length){
    mostraEsito("Gli originali di queste foto non sono ancora sul cloud.\nAspetta che PC1 finisca di caricarli e riprova.","Invio non riuscito");
    return;
  }
  /* Un invio parziale non si fa di nascosto: il cliente riceverebbe meno foto di quelle
     scelte senza che nessuno se ne accorga. Si decide sul momento. */
  if(mancanti.length){
    const ok = confirm(`${mancanti.length} foto su ${list.length} non sono ancora pronte:\n${mancanti.join(", ")}\n\n` +
                       `OK = invio subito le ${files.length} pronte\nAnnulla = aspetto e riprovo fra poco`);
    if(!ok){ toast("Invio rimandato: riprova fra qualche secondo"); return; }
  }

  const b=$("btnSend"); b.disabled=true;
  attesaInCorso = true; await tieniSchermoAcceso();
  toast(`Invio ${files.length} foto a ${email}…`);
  try{
    const r=await fetch("/api/invia",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ email, files,
        oggetto:"Le tue foto — Frame About You",
        messaggio:"Grazie per la serata! Ecco le tue foto." })
    });
    const testoGrezzo = await r.text();
    let out={}; try{ out=JSON.parse(testoGrezzo); }catch(_){}
    if(!r.ok || !out.ok){
      console.warn("filemail", r.status, testoGrezzo);
      const dettaglio = out.dettaglio || out.errore || (testoGrezzo||"").slice(0,300) || "nessuna risposta dal server";
      logTecnico(list, "invio", {esito:"errore", dettaglio:`${email} — HTTP ${r.status}: ${String(dettaglio).slice(0,200)}`});
      mostraEsito(`Il server ha risposto ${r.status}.\n\n${dettaglio}`, "Invio non riuscito");
      return;
    }
    logActivity(list,"inviate");
    logTecnico(list, "invio", {dettaglio:`${files.length}/${list.length} foto a ${email}`+(mancanti.length?" — saltate: "+mancanti.join(", "):"")});
    mostraEsito(`Inviate ${out.inviate||files.length} foto a ${email}.\nIl cliente riceve un link valido 7 giorni.`);
  }catch(err){
    console.warn("filemail", err);
    logTecnico(list, "invio", {esito:"errore", dettaglio:`${email} — server irraggiungibile: `+((err&&err.message)||err)});
    mostraEsito("Non sono riuscito a contattare il server di invio.\n\n"+(err && err.message ? err.message : err), "Invio non riuscito");
  }finally{ b.disabled=false; attesaInCorso=false; rilasciaSchermo(); }
}

/* ---------- visore con zoom (pinch) e swipe ---------- */
const V = { list:[], idx:0, img:null, scale:1, tx:0, ty:0, canvas:null, ctx:null };
async function openViewer(p){
  V.list = visible(); V.idx = V.list.findIndex(x=>x.id===p.id);
  $("viewer").classList.add("open");
  V.canvas=$("vCanvas"); V.ctx=V.canvas.getContext("2d");
  sizeCanvas();
  await showCurrent();
}
function sizeCanvas(){
  const c=V.canvas, r=c.getBoundingClientRect();
  c.width=r.width*devicePixelRatio; c.height=r.height*devicePixelRatio;
}
/* Anteprime grandi tenute in memoria: quelle gia' viste e quelle che stanno per servire. */
const bigCache = new Map();          // url -> Image decodificata
function ricordaBig(url, im){
  bigCache.set(url, im);
  if(bigCache.size>14){ bigCache.delete(bigCache.keys().next().value); }
}
function caricaBig(url){
  if(!url) return Promise.resolve(null);
  const gia = bigCache.get(url);
  if(gia) return Promise.resolve(gia);
  return new Promise(res=>{
    const im=new Image(); im.crossOrigin="anonymous"; im.src=url;
    im.decode().then(()=>{ ricordaBig(url, im); res(im); }).catch(()=>res(null));
  });
}
/* Precarica in silenzio le due foto avanti e una indietro: scorrendo col dito la
   successiva e' gia' pronta invece di comparire nera per qualche secondo. */
function precaricaVicine(){
  [1,2,-1].forEach(d=>{
    const q = V.list[V.idx+d];
    if(q) caricaBig(q.bigUrl || q.url);
  });
}

async function showCurrent(){
  const p=V.list[V.idx]; if(!p) return;
  $("vCode").textContent=p.code;
  $("vFav").classList.toggle("on",p.fav); $("vFav").textContent=p.fav?'♥':'♡';
  V.scale=1; V.tx=0; V.ty=0;
  const url = p.bigUrl || p.url;

  /* 1) se l'anteprima grande e' gia' in memoria si mostra all'istante */
  const pronta = bigCache.get(url);
  if(pronta){ V.img=pronta; draw(); precaricaVicine(); return; }

  /* 2) altrimenti si mostra SUBITO la miniatura gia' decodificata, ingrandita.
     Per un attimo e' meno nitida, ma il cliente vede la sua foto invece del nero:
     un vuoto nero davanti al cliente sembra un guasto, una foto morbida no. */
  V.img = (p.url && thumbBmpCache.get(p.url)) || null;
  draw();

  /* 3) e appena arriva la versione grande si sostituisce, se siamo ancora su questa foto */
  const atteso = p.code;
  const im = await caricaBig(url);
  if(im && V.list[V.idx] && V.list[V.idx].code === atteso){ V.img=im; draw(); }
  precaricaVicine();
}
function draw(){
  const c=V.canvas, ctx=V.ctx; if(!ctx) return;
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,c.width,c.height);
  ctx.fillStyle="#000"; ctx.fillRect(0,0,c.width,c.height);
  if(!V.img) return;
  const cw=c.width, ch=c.height;
  const iw=V.img.naturalWidth || V.img.width, ih=V.img.naturalHeight || V.img.height;
  const base=Math.min(cw/iw, ch/ih);
  const k=base*V.scale;
  const w=iw*k, h=ih*k;
  const x=(cw-w)/2 + V.tx*devicePixelRatio;
  const y=(ch-h)/2 + V.ty*devicePixelRatio;
  ctx.drawImage(V.img, x, y, w, h);
}
$("vClose").onclick=closeViewer;
function closeViewer(){ $("viewer").classList.remove("open"); V.img=null; }
$("vFav").onclick=()=>{ const p=V.list[V.idx]; if(p){ toggleFav(p); $("vFav").classList.toggle("on",p.fav); $("vFav").textContent=p.fav?'♥':'♡'; } };
addEventListener("resize",()=>{ if($("viewer").classList.contains("open")){ sizeCanvas(); draw(); } });

/* gesti touch: 1 dito = swipe (se non zoomato) o pan (se zoomato); 2 dita = pinch zoom */
let touchStart=null, pinchStart=null, panStart=null;
const viewer=$("viewer");
viewer.addEventListener("touchstart",e=>{
  if(e.touches.length===2){
    pinchStart={ d:dist(e.touches), scale:V.scale };
  } else if(e.touches.length===1){
    touchStart={ x:e.touches[0].clientX, y:e.touches[0].clientY, t:Date.now() };
    panStart={ tx:V.tx, ty:V.ty };
  }
},{passive:false});
viewer.addEventListener("touchmove",e=>{
  e.preventDefault();
  if(e.touches.length===2 && pinchStart){
    const d=dist(e.touches);
    V.scale=Math.max(1, Math.min(5, pinchStart.scale * d/pinchStart.d));
    draw();
  } else if(e.touches.length===1 && touchStart){
    const dx=e.touches[0].clientX-touchStart.x, dy=e.touches[0].clientY-touchStart.y;
    if(V.scale>1){ V.tx=panStart.tx+dx; V.ty=panStart.ty+dy; draw(); }
  }
},{passive:false});
viewer.addEventListener("touchend",e=>{
  if(pinchStart && e.touches.length<2){ pinchStart=null; if(V.scale<1.05){ V.scale=1; V.tx=0; V.ty=0; draw(); } return; }
  if(touchStart && V.scale<=1.05){
    const dx=(e.changedTouches[0].clientX-touchStart.x);
    const dt=Date.now()-touchStart.t;
    if(Math.abs(dx)>60 && dt<600){
      if(dx<0 && V.idx<V.list.length-1){ V.idx++; showCurrent(); }
      else if(dx>0 && V.idx>0){ V.idx--; showCurrent(); }
    }
  }
  touchStart=null;
},{passive:false});
function dist(t){ const a=t[0], b=t[1]; return Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY); }

async function refresh(manuale){
  if(!sb || !S.sede || refreshing) return;
  refreshing = true;
  const btn = $("btnRefresh"); if(btn) btn.classList.add("busy");
  try{
    // se non c'è ancora una giornata aperta, riparto dalla sede
    if(!S.servizio){ await chooseSede(S.sede); return; }

    const g = $("grid");
    const scroll = g.scrollTop;
    const prevLetter = S.letter, prevGruppo = S.gruppo;
    const prima = S.photos.length;

    const {data:rulli, error:eR} = await sb.from("rulli").select("*").eq("servizio_id", S.servizio.id);
    if(eR) throw eR;
    const rmap = {}; (rulli||[]).forEach(r=> rmap[r.id]={lettera:r.lettera, desc:r.descrizione});
    const ids = Object.keys(rmap);

    const nuove = []; const map = new Map();
    if(ids.length){
      const foto = await caricaFotoDeiRulli(ids);
      (foto||[]).forEach(f=>{
        const r = rmap[f.rullo_id]; if(!r) return;
        const p = { id:f.id, code:f.codice, letter:r.lettera, url:f.mini_url||f.anteprima_url, bigUrl:f.anteprima_url||null, miniUrl:f.mini_url||null,
                    origPath:f.originale_url||null, fav:!!f.preferito, gruppo:f.gruppo||null };
        const vecchia = S.byId.get(f.id);
        if(vecchia && vecchia.wide) p.wide = true;   // verso già noto: niente ridisegno inutile
        if(vecchia && vecchia.origPath && !p.origPath) p.origPath = vecchia.origPath;
        nuove.push(p); map.set(p.id, p);
      });
    }

    applicaFavLocali(nuove);        // i preferiti scelti qui non si perdono con l'aggiornamento
    S.rulli = rmap; S.photos = nuove; S.byId = map;
    // tengo il rullo/gruppo che stavo guardando, se esiste ancora
    const lettereRulli = new Set(Object.values(rmap).map(r=>r.lettera));
    S.letter = (prevLetter && lettereRulli.has(prevLetter)) ? prevLetter : null;
    S.gruppo = (prevGruppo && S.letter && nuove.some(p=>p.gruppo===prevGruppo && p.letter===S.letter)) ? prevGruppo : null;
    // tengo la selezione, scartando le foto sparite
    S.selected = new Set([...S.selected].filter(id=> map.has(id)));

    render();
    g.scrollTop = scroll;
    requestAnimationFrame(()=>{ g.scrollTop = scroll; });

    const diff = nuove.length - prima;
    const ora = new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
    setDot(true, "Aggiornato alle "+ora);
    if(diff > 0) toast(diff===1 ? "1 foto nuova" : `${diff} foto nuove`);
    else if(manuale) toast("Nessuna foto nuova");

    subscribe();   // riaggancia il tempo reale se il collegamento era caduto
  }catch(err){
    console.warn("refresh", err);
    setDot(false, "Aggiornamento non riuscito");
    if(manuale) toast("Aggiornamento non riuscito — controlla la linea");
  }finally{
    refreshing = false;
    const b = $("btnRefresh"); if(b) b.classList.remove("busy");
  }
}

/* =====================================================================
   INVII — registro delle email partite da questo tablet e dalle postazioni.
   Legge le righe "~invio" della tabella attivita, che vengono scritte a ogni
   tentativo Filemail: l'esito qui e' quello vero del servizio di invio, non una
   spunta messa a mano. Diviso per giornata e per rullo, con il reinvio a portata
   di dito: capita spesso che l'email sia stata dettata male nella musica.
   ===================================================================== */
const INV = { righe:[], giorni:{}, filtro:"tutti", corrente:null };

function invPulito(x){ return String(x==null?"":x).replace(/[<>&"]/g,""); }
/* Il dettaglio non ha un formato unico: il PC scrive "email — motivo", il tablet
   "3/4 foto a email — saltate: …". L'indirizzo si pesca comunque. */
function invEmailDi(riga){
  const m = String(riga.dettaglio||"").match(/[^\s,;<>()]+@[^\s,;<>()]+\.[^\s,;<>()]+/);
  return m ? m[0] : "";
}
function invMotivoDi(riga){
  if(riga.esito !== "errore") return "";
  const pezzi = String(riga.dettaglio||"").split(" — ");
  return pezzi.length > 1 ? pezzi.slice(1).join(" — ") : String(riga.dettaglio||"");
}
function invCodiciDi(riga){
  return String(riga.codici||"").split(/[,\s]+/).map(c=>c.trim()).filter(Boolean);
}
/* Il rullo non e' sempre salvato sulla riga, ma la lettera del codice E' il rullo:
   M-433 -> rullo M. Un invio che mescola piu' rulli finisce sotto "misti". */
function invRulloDi(riga){
  if(riga.rullo_lettera) return riga.rullo_lettera;
  const l = [...new Set(invCodiciDi(riga).map(c=>(c.split("-")[0]||"").toUpperCase()).filter(Boolean))];
  return !l.length ? "—" : (l.length===1 ? l[0] : "misti");
}

async function invCarica(){
  const box = $("invList");
  if(!sb || !S.sede){ box.innerHTML = '<p class="ivuoto"><b>Serve una sede</b>Scegli prima la sede in alto.</p>'; return; }
  box.innerHTML = '<p class="ivuoto">Carico…</p>';
  INV.righe = []; INV.giorni = {};
  const gg = parseInt($("invGiorni").value,10) || 30;
  const limite = new Date(Date.now() - gg*24*3600*1000).toISOString().slice(0,10);
  try{
    // solo le giornate di QUESTA sede: ogni locale vede i propri invii e basta
    const {data:servizi} = await sb.from("servizi").select("id,data_servizio")
      .eq("sede_id", S.sede.id).gte("data_servizio", limite);
    if(!servizi || !servizi.length){
      box.innerHTML = '<p class="ivuoto"><b>Nessuna giornata</b>In questo periodo la sede non ha servizi.</p>';
      invContatori([]); return;
    }
    servizi.forEach(v=>{ INV.giorni[v.id] = v.data_servizio; });
    const {data} = await sb.from("attivita").select("*")
      .in("servizio_id", servizi.map(v=>v.id))
      .eq("azione", "~invio")
      .order("creato_il", {ascending:false}).limit(1000);
    INV.righe = data || [];
  }catch(err){
    console.warn("registro invii", err);
    box.innerHTML = '<p class="ivuoto"><b>Registro non caricato</b>La connessione non ha risposto. Riapri per riprovare.</p>';
    return;
  }
  invRender();
}

function invContatori(righe){
  const ko = righe.filter(a=>a.esito==="errore").length;
  $("invNT").textContent = righe.length || "";
  $("invNO").textContent = righe.length ? (righe.length-ko) : "";
  $("invNK").textContent = ko || "";
}

function invRender(){
  const box = $("invList");
  const q = $("invCerca").value.trim().toLowerCase();
  invContatori(INV.righe);

  let righe = INV.righe;
  if(INV.filtro==="ko") righe = righe.filter(a=>a.esito==="errore");
  if(INV.filtro==="ok") righe = righe.filter(a=>a.esito!=="errore");
  if(q) righe = righe.filter(a=>
    String(a.dettaglio||"").toLowerCase().includes(q) ||
    String(a.codici||"").toLowerCase().includes(q));

  if(!righe.length){
    const m = q ? "<b>Nessun risultato</b>Nessun invio con quello che hai scritto."
      : INV.filtro==="ko" ? "<b>Nessun invio fallito</b>In questo periodo sono partiti tutti."
      : INV.filtro==="ok" ? "<b>Nessun invio riuscito</b>Nel periodo scelto non risulta nessun invio andato a buon fine."
      : "<b>Nessun invio</b>In questo periodo non e' partita nessuna email.";
    box.innerHTML = '<p class="ivuoto">'+m+'</p>';
    return;
  }

  const perGiorno = {};
  righe.forEach(a=>{
    const g = INV.giorni[a.servizio_id] || String(a.creato_il).slice(0,10);
    (perGiorno[g] = perGiorno[g]||[]).push(a);
  });

  box.innerHTML = Object.keys(perGiorno).sort().reverse().map(g=>{
    const lista = perGiorno[g];
    const ko = lista.filter(a=>a.esito==="errore").length;
    const d = new Date(g+"T12:00:00");
    const tit = isNaN(d) ? g : d.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});

    const perRullo = {};
    lista.forEach(a=>{ const r=invRulloDi(a); (perRullo[r]=perRullo[r]||[]).push(a); });

    const blocchi = Object.keys(perRullo).sort().map(r=>{
      const voci = perRullo[r].map(a=>{
        const t = new Date(a.creato_il).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
        const err = a.esito==="errore";
        const em = invEmailDi(a), mo = invMotivoDi(a);
        return '<button class="iriga'+(err?" ko":"")+'" data-id="'+a.id+'">'
          + '<span class="l1"><span class="ora">'+t+'</span>'
          + '<span class="es">'+(err?"Non riuscito":"Inviate")+'</span>'
          + '<span class="q">'+(a.quante||0)+' foto · '+invPulito(a.postazione||"?")+'</span></span>'
          + '<span class="em">'+(invPulito(em)||"email non registrata")+'</span>'
          + (mo?'<span class="mo">'+invPulito(mo)+'</span>':"")
          + '<span class="cd">'+(invPulito(a.codici)||"—")+'</span></button>';
      }).join("");
      const kor = perRullo[r].filter(a=>a.esito==="errore").length;
      return '<section class="irullo"><h4><span class="lt">'+invPulito(r)+'</span> '
        + perRullo[r].length+' invii'+(kor?' · <span style="color:#ff8080">'+kor+' da rifare</span>':"")
        + '</h4>'+voci+'</section>';
    }).join("");

    return '<section class="igiorno"><h3>'+tit+'<span class="m">'+lista.length+' invii'
      + (ko?' · <span class="ko">'+ko+' non riusciti</span>':"")+'</span></h3>'+blocchi+'</section>';
  }).join("");
}

/* ---------- dettaglio e reinvio ---------- */
function invApri(id){
  const a = INV.righe.find(x=>String(x.id)===String(id)); if(!a) return;
  INV.corrente = a;
  const g = INV.giorni[a.servizio_id] || String(a.creato_il).slice(0,10);
  const d = new Date(g+"T12:00:00");
  const quando = isNaN(d) ? g : d.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});
  const ora = new Date(a.creato_il).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
  const mo = invMotivoDi(a);
  $("invTit").textContent = a.esito==="errore" ? "Invio non riuscito" : "Invio andato a buon fine";
  $("invSub").textContent = quando+", ore "+ora+" · rullo "+invRulloDi(a)+" · "+(a.quante||0)+" foto"
    + (mo? " · "+mo : "");
  $("invEmail").value = invEmailDi(a);
  $("invCodici").textContent = invCodiciDi(a).join("  ") || "—";
  $("invMsg").className = "";
  $("invRifai").disabled = false; $("invRifai").textContent = "Invia di nuovo";
  $("invSheet").classList.add("on");
}
function invChiudiSheet(){ $("invSheet").classList.remove("on"); INV.corrente = null; }
function invEsito(testo, ok){
  const e = $("invMsg"); e.textContent = testo; e.className = "on " + (ok?"ok":"ko");
}

async function invRifaiInvio(){
  const a = INV.corrente; if(!a || !sb) return;
  const email = $("invEmail").value.trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ invEsito("L'indirizzo email non e' valido: controllalo e riprova.", false); return; }
  const codici = invCodiciDi(a);
  if(!codici.length){ invEsito("Questo invio non ha codici foto collegati: rifallo dal PC.", false); return; }

  const b = $("invRifai"); b.disabled = true; b.textContent = "Preparo le foto…";
  invEsito("Cerco gli originali sul cloud…", true);

  /* Gli originali non sono pubblici: servono link firmati a scadenza breve, che la
     funzione su Vercel usa per scaricarli. Le foto oltre la finestra di conservazione
     non ci sono piu' sul cloud: quelle si rimandano dal PC che le ha in archivio. */
  const files = [], mancanti = [];
  try{
    const {data:rulli} = await sb.from("rulli").select("id").eq("servizio_id", a.servizio_id);
    const ids = (rulli||[]).map(r=>r.id);
    let foto = [];
    if(ids.length){
      const {data} = await sb.from("foto").select("codice,originale_url")
        .in("rullo_id", ids).in("codice", codici);
      foto = data || [];
    }
    const perCodice = new Map(foto.map(f=>[f.codice, f.originale_url]));
    for(const c of codici){
      const path = perCodice.get(c);
      if(!path){ mancanti.push(c); continue; }
      try{
        const {data,error} = await sb.storage.from("originali").createSignedUrl(path, 900);
        if(error||!data||!data.signedUrl) mancanti.push(c);
        else files.push({nome:c+".jpg", url:data.signedUrl});
      }catch(_){ mancanti.push(c); }
    }
  }catch(err){
    console.warn("originali reinvio", err);
    invEsito("Non riesco a leggere le foto dal cloud: controlla la connessione.", false);
    b.disabled = false; b.textContent = "Invia di nuovo"; return;
  }

  if(!files.length){
    invEsito("Gli originali di queste foto non sono piu' sul cloud.\nRifai l'invio dal PC che le ha in archivio.", false);
    b.disabled = false; b.textContent = "Invia di nuovo"; return;
  }

  b.textContent = "Invio…";
  invEsito("Invio "+files.length+" foto a "+email+"…", true);
  const nomi = files.map(f=>f.nome.replace(/\.jpg$/i,""));
  try{
    await tieniSchermoAcceso();
    const r = await fetch("/api/invia", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ email, files,
        oggetto:"Le tue foto — Frame About You",
        messaggio:"Grazie per la serata! Ecco le tue foto." })
    });
    const grezzo = await r.text();
    let out={}; try{ out=JSON.parse(grezzo); }catch(_){}
    if(!r.ok || !out.ok){
      const perche = out.dettaglio || out.errore || (grezzo||"").slice(0,200) || "nessuna risposta dal server";
      await invRegistra(a, nomi, files.length, email, "errore", perche);
      invEsito("Invio non riuscito: "+perche, false);
    }else{
      await invRegistra(a, nomi, out.inviate||files.length, email, "ok",
        mancanti.length ? mancanti.length+" foto non piu' sul cloud" : "");
      invEsito("Inviate "+(out.inviate||files.length)+" foto a "+email+"."
        + (mancanti.length ? "\n"+mancanti.length+" foto non erano piu' sul cloud e non sono partite." : ""), true);
      toast("Foto inviate a "+email);
      setTimeout(invChiudiSheet, 1600);
    }
  }catch(err){
    console.warn("reinvio", err);
    await invRegistra(a, nomi, files.length, email, "errore", "server irraggiungibile");
    invEsito("Non sono riuscito a contattare il server di invio: controlla la connessione.", false);
  }finally{
    rilasciaSchermo();
    b.disabled = false; b.textContent = "Invia di nuovo";
    await invCarica();
  }
}

/* Ogni reinvio scrive una riga NUOVA: la storia resta intera e si vede che quel
   cliente e' stato recuperato, con quale email e da quale tablet. */
async function invRegistra(a, nomi, quante, email, esito, motivo){
  try{
    await sb.from("attivita").insert({
      servizio_id: a.servizio_id,
      rullo_lettera: a.rullo_lettera || invRulloDi(a),
      codici: nomi.join(", "),
      azione: "~invio",
      quante,
      postazione: nomeTablet(),
      esito,
      dettaglio: email + (motivo ? " — " + motivo : "")
    });
  }catch(_){ /* il registro non deve mai bloccare l'invio */ }
}

/* ---------- comandi ---------- */
$("btnInvii").onclick = ()=>{ $("invDlg").classList.add("on"); invCarica(); };
$("invClose").onclick = ()=> $("invDlg").classList.remove("on");
$("invGiorni").onchange = invCarica;
$("invCerca").oninput = invRender;
document.querySelectorAll(".ichip").forEach(c=>{
  c.onclick = ()=>{
    document.querySelectorAll(".ichip").forEach(x=>x.classList.remove("on"));
    c.classList.add("on"); INV.filtro = c.dataset.f; invRender();
  };
});
$("invList").onclick = e => { const b=e.target.closest(".iriga"); if(b) invApri(b.dataset.id); };
$("invAnnulla").onclick = invChiudiSheet;
$("invSheet").onclick = e => { if(e.target.id==="invSheet") invChiudiSheet(); };
$("invRifai").onclick = invRifaiInvio;

/* avvio */
loadSedi();
if(!sb) setDot(false,"Cloud non disponibile");
</script>
